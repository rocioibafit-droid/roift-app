:root{--g:#3C5F44;--gd:#2E4A35;--tint:#E6EEE7;--tint2:#D8E6DB;--line:#B9CFBE;--bg:#F9F4EE;--card:#fff;--cb:#E4DED2;--div:#ECE7DB;--ink:#1F2A22;--mut:#5F6B61;--warn:#8A4B1F;--warnbg:#F6E7D6;--red:#9B2C2C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{background:var(--card);border:1px solid var(--cb);border-radius:16px;padding:28px;width:min(380px,100%);text-align:center}
.lbox img{width:150px;margin-bottom:8px}
.lbox p{color:var(--mut);margin:0 0 18px}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--cb);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav img{width:130px;margin:0 auto 14px;display:block}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on{background:var(--tint);color:var(--gd)}
nav .sp{flex:1}
nav .out{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;cursor:pointer;border-radius:10px}
main{padding:24px max(16px,env(safe-area-inset-right)) 40px 28px;min-width:0;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--mut);margin:2px 0 0}
/* controls */
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gd)}
.btn.sec{background:var(--tint);color:var(--gd)}
.btn.sec:hover{background:var(--tint2)}
.btn.dng{background:#fff;color:var(--red);border:1px solid #E2BDBD}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:0}
label{display:block;font-size:13px;font-weight:600;color:var(--gd);margin:0 0 4px}
.f{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tag{display:inline-block;background:var(--tint);color:var(--gd);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.w{background:var(--warnbg);color:var(--warn)}
/* cards / lists */
.card{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:14px 16px}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.row .m{min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint2);color:var(--gd);display:grid;place-items:center;font-weight:700;flex:none}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--div);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.search{max-width:320px}
.banner{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,42,34,.45);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.back{background:none;border:0;color:var(--gd);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.sec2{margin-top:18px}
@media(max-width:760px){
 #app{grid-template-columns:1fr;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--cb);z-index:20}
 nav img,nav .sp,nav .out{display:none}
 nav a{flex-direction:column;gap:2px;font-size:12px;padding:6px 14px}
 main{padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
 .grid2{grid-template-columns:1fr}
 .mobhead{display:flex!important}
}
.blk{margin-top:14px}
.blk-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.blk-h input{font-weight:700}
.it{border-top:1px solid var(--div);padding:10px 0;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:center}
.it.al{grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) auto}
.it .nm{min-width:0}.it .nm small{display:block;color:var(--mut)}
.ib{display:flex;gap:4px}
.ib button{background:var(--tint);border:0;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--gd)}
.pk label{display:flex;gap:8px;align-items:center;padding:6px 4px;font-weight:400;color:var(--ink);cursor:pointer;margin:0;font-size:14px}
.pk input{width:auto}
.ghead{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 2px;font-weight:700}
.plrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--div)}
.plrow:first-of-type{border-top:0}
@media(max-width:760px){.it,.it.al{grid-template-columns:1fr 1fr}.it .nm{grid-column:1/-1}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.dtab{border:1px solid var(--cb);background:#fff;border-radius:99px;padding:10px 22px;font-weight:600;cursor:pointer;color:var(--ink)}
.dtab.on{background:var(--g);border-color:var(--g);color:#fff}
.dtab.add{border-style:dashed;border-color:var(--line);background:transparent;color:var(--gd)}
.chip.sub{background:var(--bg)}.chip.sub.on{background:var(--tint2);color:var(--gd);border-color:var(--line)}
.liblist{display:grid;gap:8px;max-height:64vh;overflow:auto}
.lrow{display:flex;gap:12px;align-items:center;border:1px solid var(--cb);border-radius:12px;padding:11px 14px;margin:0;font-weight:500;color:var(--ink);cursor:pointer;font-size:15px}
.lrow.on{background:var(--tint);border-color:var(--line)}
.lrow input{width:20px;height:20px;accent-color:var(--g);flex:none}
.lrow span{flex:1;min-width:0}.lrow small{color:var(--mut);font-weight:400}
.xcard{border:1px solid var(--cb);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.xh{display:flex;gap:8px;align-items:center;margin-bottom:10px}.xh b{flex:1;min-width:0}.xh small{color:var(--mut)}
.x3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segm{display:none;gap:6px;margin-bottom:12px}.segm .chip.on{background:var(--g);color:#fff}
@media(max-width:900px){.split{grid-template-columns:1fr}.segm{display:flex}.split[data-v=plan] #pLib{display:none}.split[data-v=lib] #pPlan{display:none}.liblist{max-height:none}}
#app{grid-template-columns:248px 1fr}
nav{padding:28px 20px;gap:4px}
nav img{width:100%;max-width:190px;margin:0 0 24px}
nav a{min-height:44px;padding:0 14px;color:#3E4A41;font-size:15px}
nav a.on,nav .mas.on{background:var(--tint);color:var(--gd);font-weight:600}
nav .mas{display:none;background:none;border:0;color:#3E4A41;cursor:pointer;border-radius:10px;font-weight:500}
nav .me{display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--cb);margin-top:8px}
nav .me .av{width:36px;height:36px;font-size:14px}
nav .out{padding:8px 0 0}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--tint);color:var(--gd);white-space:nowrap}
.p-nueva{background:#E8F0FE;color:#1A4DB3}.p-entrevista_agendada{background:#FFF1DB;color:#8A5300}.p-plan_propuesto{background:var(--tint);color:var(--gd)}
.p-cliente_activo,.p-activo{background:var(--tint2);color:var(--gd)}.p-pausado,.p-no_continuo,.p-finalizado{background:#EEE9E0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.stat{background:#fff;border:1px solid var(--cb);border-radius:16px;padding:22px}
.stat small{display:block;color:var(--mut);font-weight:500;font-size:14px}.stat b{display:block;font-size:36px;margin-top:8px;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.kv{display:grid;gap:14px}.kv small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.card{border-radius:16px;padding:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--cb);border-radius:16px;overflow:hidden;cursor:pointer}
.pfoto{height:130px;background:var(--tint2);color:var(--gd);display:grid;place-items:center;font-size:34px;font-weight:700}
.pbody{padding:14px 16px;display:grid;gap:3px}.pbody small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pprice{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;border-top:1px solid var(--div);padding-top:8px}.pprice strong{font-size:17px}.pprice small{text-transform:none;letter-spacing:0;font-weight:400}
.sheet a{display:flex;gap:12px;align-items:center;min-height:48px;color:var(--ink);text-decoration:none;font-weight:500;border-top:1px solid var(--div)}
@media(max-width:900px){.g2{grid-template-columns:1fr!important}}
@media(max-width:760px){
 #app{grid-template-columns:1fr}
 nav a.dsk,nav .me{display:none}
 nav .mas{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 14px}
 nav a{font-size:12px;min-height:0;padding:6px 14px}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap}
 .stats{grid-template-columns:1fr}
}
.mobhead{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}
.mobhead img{height:34px}
</style>
</head>

/* ---------- datos ---------- */
async function loadAll() {
  const [c, k, e, a] = await Promise.all([
    sb.from("consultas").select("*").order("created_at", { ascending: false }),
    sb.from("clientes").select("*").order("nombre"),
    sb.from("ejercicios").select("*").eq("activo", true).order("zona").order("grupo_muscular").order("nombre"),
    sb.from("alimentos").select("*").eq("activo", true).order("grupo").order("nombre")
  ]);
  for (const r of [c, k, e, a]) if (r.error) { toast("Error al cargar: " + r.error.message); return; }
  S.consultas = c.data; S.clientes = k.data; S.ejercicios = e.data; S.alimentos = a.data;
}

  const al = d.alimentos.map(x => ({ grupo: x.grupo, subgrupo: x.subgrupo || null, nombre: x.nombre, restricciones: [...x.alertas, ...x.dieta].join("; ") || null, origen: x.origen || null }));
  let r = await sb.from("ejercicios").upsert(ej, { onConflict: "user_id,nombre", ignoreDuplicates: true });
  if (r.error) throw r.error;

  if (r.error) throw r.error;
}

function viewConsultas() {
  const list = S.consultas.filter(c => S.filtro === "todas" || c.estado === S.filtro);
  const counts = Object.fromEntries(ESTADOS.map(([v]) => [v, S.consultas.filter(c => c.estado === v).length]));
  const hoy = new Date().toISOString().slice(0, 10);
  $("#view").innerHTML = `
  <div class="top"><div><h1>Consultas</h1><p class="sub">Personas que escribieron por redes y todavía no son clientes.</p></div><button class="btn" id="nuevaC">+ Nueva consulta</button></div>
  <div class="chips">
    <button class="chip ${S.filtro === "todas" ? "on" : ""}" data-f="todas">Todas (${S.consultas.length})</button>
    ${ESTADOS.map(([v, l]) => `<button class="chip ${S.filtro === v ? "on" : ""}" data-f="${v}">${l} (${counts[v]})</button>`).join("")}
  </div>
  <div class="list">${list.length ? list.map(c => `
    <div class="card row" data-id="${c.id}">
      <div class="m"><b>${esc(c.nombre)}</b><small>${esc(c.origen || "Sin origen")}${c.proxima_accion ? " · " + esc(c.proxima_accion) : ""}</small></div>

      ${c.fecha_seguimiento ? `<br><small style="${c.fecha_seguimiento <= hoy && !["cliente_activo", "no_continuo"].includes(c.estado) ? "color:var(--warn);font-weight:600" : "color:var(--mut)"}">Seguir: ${fmtFecha(c.fecha_seguimiento)}</small>` : ""}</div>
    </div>`).join("") : `<div class="empty">No hay consultas en esta vista.</div>`}</div>`;
  $("#nuevaC").onclick = () => formConsulta();
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; viewConsultas(); });
  document.querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => formConsulta(S.consultas.find(c => c.id === r.dataset.id)));
}
const fmtFecha = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
function formConsulta(c) {
  const n = !c;
  openModal(`<h2>${n ? "Nueva consulta" : "Consulta"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(c?.nombre)}" placeholder="Nombre de la persona"></div>
  <div class="grid2"><div class="f"><label>Origen</label><input name="origen" value="${esc(c?.origen)}" placeholder="Instagram, referida…"></div>
  <div class="f"><label>Estado</label><select name="estado">${opts(ESTADOS, c?.estado || "nueva")}</select></div></div>
  <div class="grid2"><div class="f"><label>Próxima acción</label><input name="proxima_accion" value="${esc(c?.proxima_accion)}" placeholder="Ej: mandar horarios de entrevista"></div>
  <div class="f"><label>Fecha de seguimiento</label><input type="date" name="fecha_seguimiento" value="${esc(c?.fecha_seguimiento)}"></div></div>
  <div class="f"><label>Notas</label><textarea name="notas">${esc(c?.notas)}</textarea></div>
  <div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button><button class="btn sec" data-cli>Pasar a cliente</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    const read = () => ({ nombre: val(m, "nombre"), origen: val(m, "origen") || null, estado: val(m, "estado"), proxima_accion: val(m, "proxima_accion") || null, fecha_seguimiento: val(m, "fecha_seguimiento") || null, notas: val(m, "notas") || null });
    m.querySelector("[data-ok]").onclick = async () => {
      const d = read(); if (!d.nombre) { $("#merr").textContent = "Falta el nombre."; return; }
      const r = n ? await sb.from("consultas").insert(d) : await sb.from("consultas").update(d).eq("id", c.id);
      if (r.error) return fail(r.error);
      closeModal(); await loadAll(); viewConsultas(); toast("Consulta guardada");
    };
    if (!n) {
      m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina la consulta de ${c.nombre}.`, async () => {
        const r = await sb.from("consultas").delete().eq("id", c.id); if (r.error) return fail(r.error);
        await loadAll(); viewConsultas(); toast("Consulta eliminada");
      });
      m.querySelector("[data-cli]").onclick = async () => {
        const d = read(); if (!d.nombre) return;
        const ya = S.clientes.find(k => k.consulta_id === c.id);
        if (ya) { closeModal(); location.hash = "#cliente-" + ya.id; return; }
        const u = await sb.from("consultas").update({ ...d, estado: "cliente_activo" }).eq("id", c.id); if (u.error) return fail(u.error);
        const r = await sb.from("clientes").insert({ consulta_id: c.id, nombre: d.nombre }).select().single(); if (r.error) return fail(r.error);
        closeModal(); await loadAll(); location.hash = "#cliente-" + r.data.id; toast("Cliente creado: completá la entrevista");
      };
    }
  });
}

  biblioteca: '<path d="M5 4h11a3 3 0 013 3v13H8a3 3 0 01-3-3z"/>', catalogo: '<path d="M3 12V4h8l9 9-8 8z"/><circle cx="7.5" cy="8.5" r="1"/>',

const svg = n => `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]}</svg>`;
const pill = (cls, txt) => `<span class="pill p-${cls}">${esc(txt)}</span>`;
const initials = n => n.trim().split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase() || "?";
const money = n => n == null || n === "" ? "Consultar" : "$ " + Number(n).toLocaleString("es-AR", { maximumFractionDigits: 2 });
const hoyISO = () => new Date().toLocaleDateString("sv-SE");
const kv = (l, v) => `<div><small>${esc(l)}</small>${v ? esc(v) : '<span style="color:var(--mut)">Sin completar</span>'}</div>`;

/* ---------- inicio ---------- */
async function viewInicio() {
  const abiertas = S.consultas.filter(c => !["cliente_activo", "no_continuo"].includes(c.estado))
    .sort((a, b) => (a.fecha_seguimiento || "9999").localeCompare(b.fecha_seguimiento || "9999")).slice(0, 6);
  const nuevas = S.consultas.filter(c => c.estado === "nueva").length;
  const activos = S.clientes.filter(c => c.estado === "activo").length;
  const recientes = [...S.clientes].sort((a, b) => (b.created_at || "").localeCompare(a.created_at || "")).slice(0, 5);
  $("#view").innerHTML = `
  <div class="top"><div><h1 style="font-size:28px">Hola, Rocío</h1><p class="sub">Esto es lo que hay para seguir hoy.</p></div><button class="btn" id="nc">Nueva consulta</button></div>
  <div class="stats">
    <div class="stat"><small>Consultas nuevas</small><b>${nuevas}</b><span>Sin responder todavía</span></div>
    <div class="stat"><small>Clientes activos</small><b>${activos}</b><span>En seguimiento</span></div>
    <div class="stat"><small>Planes en borrador</small><b id="stBor">…</b><span>Para terminar y enviar</span></div>
  </div>
  <div class="g2 sec2" style="grid-template-columns:3fr 2fr">
    <div class="card"><h2 style="margin-bottom:6px">Consultas para seguir</h2>
      ${abiertas.map(c => `<div class="plrow row" data-c="${c.id}" style="cursor:pointer"><div><b style="white-space:normal">${esc(c.nombre)}</b><small>${esc([c.origen, c.proxima_accion].filter(Boolean).join(" · ") || "Sin detalle")}</small></div>${pill(c.estado, lab(ESTADOS, c.estado))}</div>`).join("") || `<div class="empty">No hay consultas abiertas.</div>`}</div>
    <div class="card"><h2 style="margin-bottom:6px">Clientes recientes</h2>
      ${recientes.map(c => `<div class="plrow row" data-k="${c.id}" style="cursor:pointer"><div><b>${esc(c.nombre)}</b><small>${c.nivel ? "Nivel " + lab(NIVELES, c.nivel).toLowerCase() : "Entrevista pendiente"}</small></div>${pill(c.estado, lab(ESTCLI, c.estado))}</div>`).join("") || `<div class="empty">Todavía no hay clientes.</div>`}</div>
  </div>`;
  $("#nc").onclick = () => { location.hash = "#consultas"; setTimeout(() => formConsulta(), 50); };
  document.querySelectorAll("[data-c]").forEach(r => r.onclick = () => { location.hash = "#consultas"; const c = S.consultas.find(x => x.id === r.dataset.c); setTimeout(() => formConsulta(c), 50); });
  document.querySelectorAll("[data-k]").forEach(r => r.onclick = () => location.hash = "#cliente-" + r.dataset.k);
  const [a, b] = await Promise.all(["rutinas", "planes_alimentacion"].map(t => sb.from(t).select("id", { count: "exact", head: true }).eq("estado", "borrador")));
  const el = $("#stBor"); if (el) el.textContent = (a.count || 0) + (b.count || 0);
}

/* ---------- listas de rutinas y planes de alimentación ---------- */
async function viewPlanes(k) {
  const c = CFG[k], esR = k === "rutina";
  $("#view").innerHTML = `<div class="top"><div><h1>${esR ? "Rutinas" : "Alimentación"}</h1><p class="sub">${esR ? "Todas las rutinas armadas, de todos los clientes." : "Todos los planes de alimentación, de todos los clientes."}</p></div><button class="btn" id="npl">${esR ? "+ Nueva rutina" : "+ Nuevo plan"}</button></div><div class="card" id="plbox"><small class="sub">Cargando…</small></div>`;
  $("#npl").onclick = () => {
    if (!S.clientes.length) return toast("Primero cargá un cliente");
    openModal(`<h2>${esR ? "Nueva rutina" : "Nuevo plan"}</h2><div class="f"><label>¿Para qué cliente?</label><select name="cli">${S.clientes.map(x => `<option value="${x.id}">${esc(x.nombre)}</option>`).join("")}</select></div><div class="acts"><button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Crear y armar</button></div>`, m => {
      m.querySelector("[data-x]").onclick = closeModal; m.querySelector("[data-ok]").onclick = () => { const id = val(m, "cli"); closeModal(); nuevoPlan(k, id); };
    });
  };
  const r = await sb.from(c.plan).select("id,nombre,estado,cliente_id,updated_at").order("updated_at", { ascending: false });
  const box = $("#plbox"); if (!box) return;
  if (r.error) { box.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; return; }
  box.innerHTML = r.data.map(p => { const cl = S.clientes.find(x => x.id === p.cliente_id); return `<div class="plrow"><div><b>${esc(p.nombre)}</b><br><small class="sub">${esc(cl?.nombre || "Cliente eliminado")}</small></div>
    <div class="acts" style="margin:0">${pill(p.estado === "borrador" ? "pausado" : "activo", lab(ESTPLAN, p.estado))}<button class="btn sm" data-o="${p.id}">Abrir</button><button class="btn sec sm" data-p="${p.id}">PDF</button></div></div>`; }).join("") || `<div class="empty">Todavía no hay ${esR ? "rutinas" : "planes"}. Creá uno con el botón de arriba.</div>`;
  box.querySelectorAll("[data-o]").forEach(b => b.onclick = () => location.hash = `#armar-${k}-${b.dataset.o}`);
  box.querySelectorAll("[data-p]").forEach(b => b.onclick = async () => { b.disabled = true; try { await descargarPdf(await loadPlan(k, b.dataset.p)); } catch (e) { fail(e); } b.disabled = false; });
}

  document.querySelectorAll("[data-new]").forEach(b => b.onclick = () => nuevoPlan(b.dataset.new, id));

async function cargarRutActual(cid) {
  const r = await sb.from("rutinas").select("id").eq("cliente_id", cid).order("created_at", { ascending: false }).limit(1);
  const box = $("#rutAct"); if (!box || FICHA.cid !== cid) return;
  if (r.error || !r.data.length) { box.innerHTML = `<small class="sub">Todavía no hay una rutina armada. Apretá “Editar rutina” para empezar.</small>`; return; }
  FICHA.rutId = r.data[0].id;
  try {
    const P = await loadPlan("rutina", FICHA.rutId); if (!$("#rutAct")) return;
    $("#rutAct").innerHTML = `<div class="sub" style="margin-bottom:6px">${esc(P.nombre)} · ${pill(P.estado === "borrador" ? "pausado" : "activo", lab(ESTPLAN, P.estado))}</div>` +
      (P.blocks.map((b, i) => `<div class="plrow"><div><small class="sub">Día ${i + 1}</small><br><b>${esc(b.titulo || "Sin nombre")}</b></div><span class="sub">${b.items.length} ejercicios</span></div>`).join("") || `<small class="sub">Rutina vacía.</small>`);
  } catch (e) { box.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

  openModal(`<h2>Entrevista de ${esc(c.nombre)}</h2>
  <div class="grid2"><div class="f"><label>Nombre</label><input name="nombre" value="${esc(c.nombre)}"></div><div class="f"><label>Teléfono</label><input name="telefono" inputmode="tel" value="${esc(c.telefono)}"></div>

  <div class="f"><label>Objetivo</label><input name="objetivo" value="${esc(c.objetivo)}" placeholder="Ej: ganar masa muscular"></div>

  <div class="f"><label>Dónde entrena</label><select name="lugar">${opts(LUGARES, c.lugar_entrenamiento)}</select></div>

  <div class="acts"><button class="btn dng" data-del>Eliminar cliente</button><button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {

    m.querySelector("[data-ok]").onclick = async () => {
      const g = n => val(m, n); if (!g("nombre")) { $("#merr").textContent = "Falta el nombre."; return; }
      const d = { nombre: g("nombre"), telefono: g("telefono") || null, nivel: g("nivel") || null, estado: g("estado"), objetivo: g("objetivo") || null, dias_por_semana: g("dias") ? +g("dias") : null, lugar_entrenamiento: g("lugar") || null, alimentacion_tipo: g("alim") || null, lesiones: g("lesiones") || null, alergias: g("alergias") || null, notas: g("notas") || null };

/* ---------- seguimiento (check-ins) ---------- */
async function cargarSeguimiento(cid) {
  const r = await sb.from("checkins").select("*").eq("cliente_id", cid).order("fecha", { ascending: false });
  const box = $("#segBox"); if (!box || FICHA.cid !== cid) return;
  if (r.error) { box.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; return; }
  const list = r.data, pts = list.filter(x => x.peso_kg != null).map(x => ({ f: x.fecha, p: Number(x.peso_kg) })).reverse();
  let chart = `<small class="sub">Cargá al menos 2 check-ins con peso para ver el gráfico.</small>`;
  if (pts.length >= 2) {
    const W = 400, H = 140, px = 34, py = 18, ps = pts.map(x => x.p), mn = Math.min(...ps), mx = Math.max(...ps), rg = (mx - mn) || 1;
    const X = i => px + i * (W - px - 10) / (pts.length - 1), Y = v => H - py - (v - mn) / rg * (H - 2 * py);
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Peso por check-in"><line x1="${px}" y1="${H - py}" x2="${W - 10}" y2="${H - py}" stroke="#ECE7DB"/>
      <polyline fill="none" stroke="#3C5F44" stroke-width="2.5" points="${pts.map((x, i) => X(i) + "," + Y(x.p)).join(" ")}"/>
      ${pts.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.p)}" r="4" fill="#3C5F44"/>`).join("")}
      <text x="4" y="${Y(mx) + 4}" font-size="11" fill="#5F6B61">${mx}</text><text x="4" y="${Y(mn) + 4}" font-size="11" fill="#5F6B61">${mn}</text>
      <text x="${px}" y="${H - 2}" font-size="11" fill="#5F6B61">${fmtFecha(pts[0].f)}</text><text x="${W - 10}" y="${H - 2}" font-size="11" fill="#5F6B61" text-anchor="end">${fmtFecha(pts[pts.length - 1].f)}</text></svg>`;
  }
  box.innerHTML = `<div style="margin-bottom:6px;font-weight:600;font-size:14px">Peso por check-in (kg)</div>${chart}
    <div class="scroll" style="margin-top:12px"><table class="tbl"><thead><tr><th>Fecha</th><th>Peso</th><th>Medidas</th><th>Cómo se sintió</th></tr></thead><tbody>
    ${list.map(x => `<tr data-ck="${x.id}" style="cursor:pointer"><td>${fmtFecha(x.fecha)}</td><td>${x.peso_kg != null ? esc(x.peso_kg) + " kg" : "—"}</td><td>${esc(x.medidas?.texto || "—")}</td><td>${esc(x.sensacion || "—")}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Todavía no hay check-ins.</td></tr>`}</tbody></table></div>
    <p class="sub" style="margin-top:10px;font-size:13px">Las fotos de avance se suman en la próxima actualización.</p>`;
  box.querySelectorAll("[data-ck]").forEach(t => t.onclick = () => formCheckin(cid, list.find(x => x.id === t.dataset.ck)));
}
function formCheckin(cid, ck) {
  const n = !ck;
  openModal(`<h2>${n ? "Cargar check-in" : "Check-in"}</h2>
  <div class="grid2"><div class="f"><label>Fecha</label><input type="date" name="fecha" value="${esc(ck?.fecha || hoyISO())}"></div><div class="f"><label>Peso (kg)</label><input name="peso" inputmode="decimal" value="${esc(ck?.peso_kg ?? "")}" placeholder="Ej: 62,5"></div></div>
  <div class="f"><label>Medidas (cm)</label><input name="medidas" value="${esc(ck?.medidas?.texto)}" placeholder="Ej: cintura 70, cadera 95, muslo 55"></div>
  <div class="f"><label>Cómo se sintió</label><textarea name="sens">${esc(ck?.sensacion)}</textarea></div><div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-ok]").onclick = async () => {
      const pesoTxt = val(m, "peso").replace(",", "."), peso = pesoTxt ? Number(pesoTxt) : null;
      if (pesoTxt && !isFinite(peso)) { $("#merr").textContent = "El peso tiene que ser un número."; return; }
      if (!val(m, "fecha")) { $("#merr").textContent = "Falta la fecha."; return; }
      const d = { fecha: val(m, "fecha"), peso_kg: peso, medidas: val(m, "medidas") ? { texto: val(m, "medidas") } : null, sensacion: val(m, "sens") || null };
      const r = n ? await sb.from("checkins").insert({ ...d, cliente_id: cid }) : await sb.from("checkins").update(d).eq("id", ck.id);
      if (r.error) { $("#merr").textContent = r.error.message; return; }
      closeModal(); cargarSeguimiento(cid); toast("Check-in guardado");
    };
    if (!n) m.querySelector("[data-del]").onclick = () => confirmBox("Se elimina este check-in.", async () => {
      const r = await sb.from("checkins").delete().eq("id", ck.id); if (r.error) return fail(r.error); cargarSeguimiento(cid); toast("Check-in eliminado");
    });
  });
}

/* ---------- catálogo ---------- */
const CATS = ["Calzas", "Tops", "Remeras oversize", "Accesorios"];
async function viewCatalogo() {
  $("#view").innerHTML = `<div class="empty">Cargando…</div>`;
  const r = await sb.from("productos").select("*").order("nombre");
  S.prodErr = r.error; S.productos = r.error ? [] : r.data;
  if (r.error) {
    $("#view").innerHTML = `<div class="top"><div><h1>Catálogo</h1></div></div><div class="banner"><b>Falta activar el catálogo en la base de datos.</b><br><span class="sub">Ejecutá una sola vez el archivo <b>ROIFT_catalogo.sql</b> en Supabase (SQL Editor → pegar → Run) y volvé a entrar acá.</span><div class="err" style="margin-top:8px">${esc(r.error.message)}</div></div>`;
    return;
  }
  drawCatalogo();
}
function drawCatalogo() {
  const P = S.productos, q = (S.pq || "").toLowerCase(), cat = S.pc || "";
  const cats = [...new Set([...CATS, ...P.map(p => p.categoria)])];
  const l = P.filter(p => (!cat || p.categoria === cat) && (!q || (p.nombre + " " + (p.detalle || "")).toLowerCase().includes(q)));
  const ult = P.map(p => p.precio_actualizado).filter(Boolean).sort().pop();
  $("#view").innerHTML = `
  <div class="top"><div><h1>Catálogo</h1><p class="sub">Última actualización de precios: ${ult ? fmtFecha(ult) : "—"}</p></div>
    <div class="acts" style="margin:0"><input type="file" id="xf" accept=".xlsx,.xls,.csv" class="hide"><button class="btn sec" id="imp">Importar precios desde Excel</button><button class="btn sec" id="wsp">Preparar envío por WhatsApp</button><button class="btn" id="np">+ Agregar producto</button></div></div>
  <div class="f"><input class="search" id="pq" placeholder="Buscar producto" value="${esc(S.pq || "")}"></div>
  <div class="chips"><button class="chip ${!cat ? "on" : ""}" data-c="">Todos</button>${cats.map(c => `<button class="chip ${cat === c ? "on" : ""}" data-c="${esc(c)}">${esc(c)}</button>`).join("")}</div>
  <div class="pgrid">${l.map(p => `<article class="pcard" data-p="${p.id}"><div class="pfoto">${esc(initials(p.nombre))}</div><div class="pbody"><small>${esc(p.categoria)}${p.disponible === false ? " · Sin stock" : ""}</small><b>${esc(p.nombre)}</b><span class="sub">${esc(p.detalle || "")}</span><div class="pprice"><strong>${money(p.precio)}</strong><small>Actualizado ${p.precio_actualizado ? fmtFecha(p.precio_actualizado) : "—"}</small></div></div></article>`).join("")}</div>
  ${l.length ? "" : `<div class="empty">${P.length ? "Sin resultados." : "Todavía no hay productos. Agregá uno o importá tu lista de precios desde Excel (columnas: Nombre, Categoría, Talles y colores, Precio)."}</div>`}`;

function parsePrecio(t) {

}

  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) { if (ch === '"') { if (text[i + 1] === '"') { cur += '"'; i++; } else q = false; } else cur += ch; }
    else if (ch === '"') q = true; else if (ch === d) { row.push(cur); cur = ""; }
    else if (ch === "\n" || ch === "\r") { if (ch === "\r" && text[i + 1] === "\n") i++; row.push(cur); cur = ""; if (row.some(x => x.trim())) rows.push(row); row = []; }

async function importarPrecios(file) {
  try {
    let rows;

    if (rows.length < 2) throw new Error("El archivo no tiene filas para importar.");
    const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
    const H = rows[0].map(norm), find = re => H.findIndex(h => re.test(h));

    if (iN < 0 || iP < 0) throw new Error("No encuentro las columnas “Nombre” y “Precio” en la primera fila.");
    const have = new Map(S.productos.map(p => [p.nombre.trim().toLowerCase(), p]));
    const nuevos = [], upd = [];
    for (const r of rows.slice(1)) {
      const nombre = String(r[iN] ?? "").trim(); if (!nombre) continue;
      const precio = parsePrecio(r[iP]), ex = have.get(nombre.toLowerCase());
      const extra = {}; if (iC >= 0 && String(r[iC]).trim()) extra.categoria = String(r[iC]).trim(); if (iD >= 0 && String(r[iD]).trim()) extra.detalle = String(r[iD]).trim();

    }
    if (nuevos.length) { const r = await sb.from("productos").insert(nuevos); if (r.error) throw r.error; }
    for (const [id, d] of upd) { const r = await sb.from("productos").update(d).eq("id", id); if (r.error) throw r.error; }
    await viewCatalogo(); toast(`Importado: ${nuevos.length} nuevos, ${upd.length} con precio actualizado`);
  } catch (e) { fail(e); }
}

async function pdfPlan(P, cli) {
  const { PDFDocument, StandardFonts, rgb } = PDFLib, k = P.kind, c = CFG[k];
  const doc = await PDFDocument.create();
  const F = await doc.embedFont(StandardFonts.Helvetica), FB = await doc.embedFont(StandardFonts.HelveticaBold), FI = await doc.embedFont(StandardFonts.HelveticaOblique);
  const logo = await doc.embedPng(await (await fetch(document.querySelector("nav img").src)).arrayBuffer());
  const W = 595.28, H = 841.89, M = 46, CW = W - 2 * M;
  const col = (r, g, b) => rgb(r / 255, g / 255, b / 255);
  const GREEN = col(60, 95, 68), GD = col(46, 74, 53), SAGE = col(230, 238, 231), CREAM = col(249, 244, 238), INK = col(31, 42, 34), MUT = col(95, 107, 97), LINE = col(213, 222, 213), WHITE = rgb(1, 1, 1);
  const clean = s => String(s ?? "").replace(/[–—]/g, "-").replace(/[‘’]/g, "'").replace(/[“”]/g, '"').replace(/•/g, "-").replace(/\t/g, " ").replace(/[^\n\x20-\x7E\xA0-\xFF]/g, "");
  const pages = []; let page, y;
  const newPage = () => { page = doc.addPage([W, H]); page.drawRectangle({ x: 0, y: 0, width: W, height: H, color: CREAM }); pages.push(page); y = H - M; };
  const wrap = (t, font, size, w) => {
    const out = [];
    for (const para of clean(t).split("\n")) {
      let line = "";
      for (const word of para.split(/\s+/).filter(Boolean)) {
        const test = line ? line + " " + word : word;
        if (font.widthOfTextAtSize(test, size) <= w) line = test; else { if (line) out.push(line); line = word; }
      }
      out.push(line);
    }
    return out;
  };
  const txt = (t, x, top, font, size, color) => page.drawText(clean(t), { x, y: top - size, font, size, color });
  newPage();
  const lw = 66, lh = lw * logo.height / logo.width;
  page.drawImage(logo, { x: M, y: H - M - lh, width: lw, height: lh });
  const title = clean(c.pdf), tw = FB.widthOfTextAtSize(title, 22);
  txt(title, W - M - tw, H - M - 8, FB, 22, GD);
  const sub = "ROIFT · Entrenadora personal online", sw = F.widthOfTextAtSize(clean(sub), 10);
  txt(sub, W - M - sw, H - M - 38, F, 10, MUT);
  y = H - M - lh - 18;
  const info = k === "rutina"
    ? [["Nombre", cli.nombre], ["Nivel", cli.nivel ? lab(NIVELES, cli.nivel) : ""], ["Días por semana", cli.dias_por_semana || ""], ["Objetivo", cli.objetivo], ["Dónde entrena", cli.lugar_entrenamiento ? lab(LUGARES, cli.lugar_entrenamiento) : ""], ["Detalle", cli.lesiones]]
    : [["Nombre", cli.nombre], ["Nivel", cli.nivel ? lab(NIVELES, cli.nivel) : ""], ["Objetivo", cli.objetivo], ["Tipo de alimentación", cli.alimentacion_tipo], ["Alergias o intolerancias", cli.alergias]];
  const cells = info.filter(([l, v]) => String(v ?? "").trim() || l === "Nombre").map(([l, v]) => ({ l, lines: wrap(String(v || "-"), F, 10.5, CW / 2 - 24) }));
  const rows = []; for (let i = 0; i < cells.length; i += 2) rows.push(cells.slice(i, i + 2));
  const rh = r => Math.max(...r.map(x => 14 + x.lines.length * 14)) + 6;
  const boxH = rows.reduce((s, r) => s + rh(r), 0) + 12;
  page.drawRectangle({ x: M, y: y - boxH, width: CW, height: boxH, color: SAGE, borderColor: LINE, borderWidth: 1 });
  let ty = y - 10;
  for (const r of rows) {
    r.forEach((cell, i) => { const x = M + 14 + i * (CW / 2); txt(cell.l.toUpperCase(), x, ty, FB, 8, MUT); cell.lines.forEach((ln, j) => txt(ln, x, ty - 13 - j * 14, F, 10.5, INK)); });
    ty -= rh(r);
  }
  y -= boxH + 20;
  for (const [bi, b] of P.blocks.entries()) {
    if (y - 90 < M + 30) newPage();
    page.drawRectangle({ x: M, y: y - 24, width: CW, height: 24, color: GREEN });
    txt(fullTitle(P, b, bi), M + 10, y - 6, FB, 12.5, WHITE);
    y -= 24 + 10;
    if (k === "rutina") { txt("Recordar calentar.", M, y, FB, 10, GD); y -= 20; }
    const c1 = CW * 0.52, x2 = M + c1 + 10, w2 = CW - c1 - 10;
    txt(k === "rutina" ? "EJERCICIO" : "ALIMENTO", M + 4, y, FB, 8, MUT);
    txt(k === "rutina" ? "SERIES Y REPETICIONES" : "CANTIDAD O NOTA", x2, y, FB, 8, MUT);
    y -= 14; page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 1, color: GREEN });
    y -= 6;
    for (const it of b.items) {
      const l1 = wrap(it.nombre, FB, 10.5, c1 - 8);
      const l2 = []; 
      if (k === "rutina") { if (sr(it)) wrap(sr(it), FB, 10.5, w2).forEach(t => l2.push([t, FB, GD, 10.5])); if (it.b) wrap("Descanso: " + it.b, F, 10, w2).forEach(t => l2.push([t, F, INK, 10])); if (it.c) wrap(it.c, FI, 9, w2).forEach(t => l2.push([t, FI, MUT, 9])); }
      else if (it.a) wrap(it.a, F, 10.5, w2).forEach(t => l2.push([t, F, INK, 10.5]));
      const h1 = l1.length * 14 + (k === "alim" && it.grupo ? 12 : 0), h2 = l2.length * 14, h = Math.max(h1, h2, 14) + 10;
      if (y - h < M + 30) newPage();
      l1.forEach((t, i) => txt(t, M + 4, y - 5 - i * 14, FB, 10.5, INK));
      if (k === "alim" && it.grupo) txt(it.grupo, M + 4, y - 5 - l1.length * 14, F, 8.5, MUT);
      l2.forEach(([t, f, co, sz], i) => txt(t, x2, y - 5 - i * 14, f, sz, co));
      y -= h; page.drawLine({ start: { x: M, y }, end: { x: M + CW, y }, thickness: 0.5, color: LINE });
    }
    y -= 10;
    for (const line of String(b.notas || "").split("\n").map(s => s.trim()).filter(Boolean)) {
      const ls = wrap(line, F, 10, CW - 16);
      if (y - ls.length * 14 < M + 30) newPage();
      page.drawCircle({ x: M + 4, y: y - 8, size: 2, color: GREEN });
      ls.forEach((t, i) => txt(t, M + 14, y - 2 - i * 14, k === "rutina" ? FB : F, 10, k === "rutina" ? GD : INK));
      y -= ls.length * 14 + 2;
    }
    y -= 18;
  }
  pages.forEach((p, i) => { const t = clean(`@ro_ibarra_fit · ${c.pdf} · Página ${i + 1}`), w = F.widthOfTextAtSize(t, 8.5); p.drawText(t, { x: (W - w) / 2, y: 26, font: F, size: 8.5, color: MUT }); });
  doc.setTitle(`${c.pdf} - ${cli.nombre}`); doc.setAuthor("ROIFT");

}

$("#masBtn").onclick = () => openModal(`<div class="sheet"><h2 style="margin-bottom:8px">Más</h2>
  <a href="#rutinas">${svg("rutinas")}Rutinas</a><a href="#alimentacion">${svg("alimentacion")}Alimentación</a><a href="#biblioteca">${svg("biblioteca")}Biblioteca</a><a href="#catalogo">${svg("catalogo")}Catálogo</a>
  <a href="#" id="sl" style="color:var(--mut)">Cerrar sesión</a></div>`, m => { m.querySelector("#sl").onclick = e => { e.preventDefault(); closeModal(); salir(); }; });
async function enter() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  await loadAll(); route();
}
async function salir() { await sb.auth.signOut(); S.consultas = S.clientes = S.ejercicios = S.alimentos = []; $("#app").classList.add("hide"); $("#login").classList.remove("hide"); }
$("#logout").onclick = salir; $("#logout2").onclick = salir;
window.addEventListener("hashchange", () => { if (!$("#app").classList.contains("hide")) route(); });
$("#lform").addEventListener("submit", async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
  if (error) { $("#lerr").textContent = error.message.includes("Invalid") ? "Email o contraseña incorrectos." : error.message; return; }
  $("#lpw").value = ""; enter();
});
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else $("#login").classList.remove("hide");
})();
</script>
</body>
</html>
