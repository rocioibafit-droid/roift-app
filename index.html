<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#3C5F44">
<title>ROIFT</title>
<link rel="icon" href="logo-icon.png">
<style>
:root{--g:#3C5F44;--gd:#2E4A35;--tint:#E6EEE7;--tint2:#D8E6DB;--line:#B9CFBE;--bg:#F9F4EE;--card:#fff;--cb:#E4DED2;--div:#ECE7DB;--ink:#1F2A22;--mut:#5F6B61;--warn:#8A4B1F;--warnbg:#F6E7D6;--red:#9B2C2C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{background:var(--card);border:1px solid var(--cb);border-radius:16px;padding:28px;width:min(380px,100%);text-align:center}
.lbox img{width:150px;margin-bottom:8px}
.lbox p{color:var(--mut);margin:0 0 18px}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--cb);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav img{width:130px;margin:0 auto 14px;display:block}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on{background:var(--tint);color:var(--gd)}
nav .sp{flex:1}
nav .out{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;cursor:pointer;border-radius:10px}
main{padding:24px max(16px,env(safe-area-inset-right)) 40px 28px;min-width:0;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--mut);margin:2px 0 0}
/* controls */
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gd)}
.btn.sec{background:var(--tint);color:var(--gd)}
.btn.sec:hover{background:var(--tint2)}
.btn.dng{background:#fff;color:var(--red);border:1px solid #E2BDBD}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:0}
label{display:block;font-size:13px;font-weight:600;color:var(--gd);margin:0 0 4px}
.f{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tag{display:inline-block;background:var(--tint);color:var(--gd);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.w{background:var(--warnbg);color:var(--warn)}
/* cards / lists */
.card{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:14px 16px}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.row .m{min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint2);color:var(--gd);display:grid;place-items:center;font-weight:700;flex:none}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--div);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.search{max-width:320px}
.banner{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,42,34,.45);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.back{background:none;border:0;color:var(--gd);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.sec2{margin-top:18px}
@media(max-width:760px){
 #app{grid-template-columns:1fr;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--cb);z-index:20}
 nav img,nav .sp,nav .out{display:none}
 nav a{flex-direction:column;gap:2px;font-size:12px;padding:6px 14px}
 main{padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
 .grid2{grid-template-columns:1fr}
 .mobhead{display:flex!important}
}
.mobhead{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}
.mobhead img{height:34px}
</style>
</head>
<body>

<div id="login" class="hide">
  <form class="lbox" id="lform">
    <img src="logo.png" alt="ROIFT">
    <p>Ingresá con tu usuario</p>
    <div class="f" style="text-align:left"><label for="lem">Email</label><input id="lem" type="email" autocomplete="username" required></div>
    <div class="f" style="text-align:left"><label for="lpw">Contraseña</label><input id="lpw" type="password" autocomplete="current-password" required></div>
    <div class="err" id="lerr"></div>
    <button class="btn" style="width:100%">Entrar</button>
  </form>
</div>

<div id="app" class="hide">
  <nav>
    <img src="logo.png" alt="ROIFT">
    <a href="#consultas" data-r="consultas"><span>💬</span>Consultas</a>
    <a href="#clientes" data-r="clientes"><span>👤</span>Clientes</a>
    <a href="#biblioteca" data-r="biblioteca"><span>📚</span>Biblioteca</a>
    <div class="sp"></div>
    <button class="out" id="logout">Cerrar sesión</button>
  </nav>
  <main>
    <div class="mobhead"><img src="logo.png" alt="ROIFT"><button class="out btn sec sm" id="logout2">Salir</button></div>
    <div id="view"></div>
  </main>
</div>
<div id="modal"></div>
<div id="toast" class="hide"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = "https://fsuugizyyozhfeycdvgf.supabase.co";
const SUPABASE_KEY = "sb_publishable_SMz0F6GPBJFIJToTvC4rRA_OXKbpAbM";

const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const ESTADOS = [["nueva", "Consulta nueva"], ["entrevista_agendada", "Entrevista agendada"], ["plan_propuesto", "Plan propuesto"], ["cliente_activo", "Cliente activo"], ["pausado", "Pausado"], ["no_continuo", "No continuó"]];
const NIVELES = [["", "Sin definir"], ["principiante", "Principiante"], ["intermedio", "Intermedio"], ["avanzado", "Avanzado"], ["culturista", "Culturista"]];
const LUGARES = [["", "Sin definir"], ["gimnasio", "Gimnasio"], ["casa", "Casa"], ["ambos", "Ambos"]];
const ESTCLI = [["activo", "Activo"], ["pausado", "Pausado"], ["finalizado", "Finalizado"]];
const lab = (arr, v) => (arr.find(x => x[0] === v) || [, v || ""])[1];
const opts = (arr, sel) => arr.map(([v, l]) => `<option value="${esc(v)}"${v === (sel ?? "") ? " selected" : ""}>${esc(l)}</option>`).join("");
const S = { consultas: [], clientes: [], ejercicios: [], alimentos: [], filtro: "todas", q: "", bib: "ejercicios", zona: "", grupoAl: "" };

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.remove("hide");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.add("hide"), 3200);
}
function fail(e) { console.error(e); toast("No se pudo guardar: " + (e.message || e)); }

/* ---------- datos ---------- */
async function loadAll() {
  const [c, k, e, a] = await Promise.all([
    sb.from("consultas").select("*").order("created_at", { ascending: false }),
    sb.from("clientes").select("*").order("nombre"),
    sb.from("ejercicios").select("*").eq("activo", true).order("zona").order("grupo_muscular").order("nombre"),
    sb.from("alimentos").select("*").eq("activo", true).order("grupo").order("nombre")
  ]);
  for (const r of [c, k, e, a]) if (r.error) { toast("Error al cargar: " + r.error.message); return; }
  S.consultas = c.data; S.clientes = k.data; S.ejercicios = e.data; S.alimentos = a.data;
}
async function seedBiblioteca() {
  const res = await fetch("biblioteca.json"); const d = await res.json();
  const ej = d.ejercicios.map(x => ({ zona: x.zona, grupo_muscular: x.grupo, nombre: x.nombre, equipamiento: x.equipo || null, origen: x.origen || null, notas: x.notas || null }));
  const al = d.alimentos.map(x => ({ grupo: x.grupo, subgrupo: x.subgrupo || null, nombre: x.nombre, restricciones: [...x.alertas, ...x.dieta].join("; ") || null, origen: x.origen || null }));
  let r = await sb.from("ejercicios").upsert(ej, { onConflict: "user_id,nombre", ignoreDuplicates: true });
  if (r.error) throw r.error;
  r = await sb.from("alimentos").upsert(al, { onConflict: "user_id,nombre", ignoreDuplicates: true });
  if (r.error) throw r.error;
}

/* ---------- modal ---------- */
function openModal(html, onReady) {
  $("#modal").innerHTML = `<div class="ov" id="ov"><div class="modal">${html}</div></div>`;
  $("#ov").addEventListener("mousedown", e => { if (e.target.id === "ov") closeModal(); });
  onReady && onReady($("#modal"));
}
function closeModal() { $("#modal").innerHTML = ""; }
function confirmBox(texto, onYes) {
  openModal(`<h2>¿Seguro?</h2><p>${esc(texto)}</p><div class="acts"><button class="btn sec" data-x>Cancelar</button><button class="btn dng" data-y>Sí, eliminar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-y]").onclick = async () => { closeModal(); await onYes(); };
  });
}
const val = (m, n) => { const el = m.querySelector(`[name="${n}"]`); return el ? el.value.trim() : ""; };

/* ---------- consultas ---------- */
function viewConsultas() {
  const list = S.consultas.filter(c => S.filtro === "todas" || c.estado === S.filtro);
  const counts = Object.fromEntries(ESTADOS.map(([v]) => [v, S.consultas.filter(c => c.estado === v).length]));
  const hoy = new Date().toISOString().slice(0, 10);
  $("#view").innerHTML = `
  <div class="top"><div><h1>Consultas</h1><p class="sub">Personas que escribieron por redes y todavía no son clientes.</p></div><button class="btn" id="nuevaC">+ Nueva consulta</button></div>
  <div class="chips">
    <button class="chip ${S.filtro === "todas" ? "on" : ""}" data-f="todas">Todas (${S.consultas.length})</button>
    ${ESTADOS.map(([v, l]) => `<button class="chip ${S.filtro === v ? "on" : ""}" data-f="${v}">${l} (${counts[v]})</button>`).join("")}
  </div>
  <div class="list">${list.length ? list.map(c => `
    <div class="card row" data-id="${c.id}">
      <div class="m"><b>${esc(c.nombre)}</b><small>${esc(c.origen || "Sin origen")}${c.proxima_accion ? " · " + esc(c.proxima_accion) : ""}</small></div>
      <div style="text-align:right;flex:none"><span class="tag">${lab(ESTADOS, c.estado)}</span>
      ${c.fecha_seguimiento ? `<br><small style="${c.fecha_seguimiento <= hoy && !["cliente_activo", "no_continuo"].includes(c.estado) ? "color:var(--warn);font-weight:600" : "color:var(--mut)"}">Seguir: ${fmtFecha(c.fecha_seguimiento)}</small>` : ""}</div>
    </div>`).join("") : `<div class="empty">No hay consultas en esta vista.</div>`}</div>`;
  $("#nuevaC").onclick = () => formConsulta();
  document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => { S.filtro = b.dataset.f; viewConsultas(); });
  document.querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => formConsulta(S.consultas.find(c => c.id === r.dataset.id)));
}
const fmtFecha = d => { const [y, m, dd] = d.split("-"); return `${dd}/${m}/${y}`; };
function formConsulta(c) {
  const n = !c;
  openModal(`<h2>${n ? "Nueva consulta" : "Consulta"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(c?.nombre)}" placeholder="Nombre de la persona"></div>
  <div class="grid2"><div class="f"><label>Origen</label><input name="origen" value="${esc(c?.origen)}" placeholder="Instagram, referida…"></div>
  <div class="f"><label>Estado</label><select name="estado">${opts(ESTADOS, c?.estado || "nueva")}</select></div></div>
  <div class="grid2"><div class="f"><label>Próxima acción</label><input name="proxima_accion" value="${esc(c?.proxima_accion)}" placeholder="Ej: mandar horarios de entrevista"></div>
  <div class="f"><label>Fecha de seguimiento</label><input type="date" name="fecha_seguimiento" value="${esc(c?.fecha_seguimiento)}"></div></div>
  <div class="f"><label>Notas</label><textarea name="notas">${esc(c?.notas)}</textarea></div>
  <div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button><button class="btn sec" data-cli>Pasar a cliente</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    const read = () => ({ nombre: val(m, "nombre"), origen: val(m, "origen") || null, estado: val(m, "estado"), proxima_accion: val(m, "proxima_accion") || null, fecha_seguimiento: val(m, "fecha_seguimiento") || null, notas: val(m, "notas") || null });
    m.querySelector("[data-ok]").onclick = async () => {
      const d = read(); if (!d.nombre) { $("#merr").textContent = "Falta el nombre."; return; }
      const r = n ? await sb.from("consultas").insert(d) : await sb.from("consultas").update(d).eq("id", c.id);
      if (r.error) return fail(r.error);
      closeModal(); await loadAll(); viewConsultas(); toast("Consulta guardada");
    };
    if (!n) {
      m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina la consulta de ${c.nombre}.`, async () => {
        const r = await sb.from("consultas").delete().eq("id", c.id); if (r.error) return fail(r.error);
        await loadAll(); viewConsultas(); toast("Consulta eliminada");
      });
      m.querySelector("[data-cli]").onclick = async () => {
        const d = read(); if (!d.nombre) return;
        const ya = S.clientes.find(k => k.consulta_id === c.id);
        if (ya) { closeModal(); location.hash = "#cliente-" + ya.id; return; }
        const u = await sb.from("consultas").update({ ...d, estado: "cliente_activo" }).eq("id", c.id); if (u.error) return fail(u.error);
        const r = await sb.from("clientes").insert({ consulta_id: c.id, nombre: d.nombre }).select().single(); if (r.error) return fail(r.error);
        closeModal(); await loadAll(); location.hash = "#cliente-" + r.data.id; toast("Cliente creado: completá la entrevista");
      };
    }
  });
}

/* ---------- clientes ---------- */
function viewClientes() {
  const q = S.q.toLowerCase();
  const list = S.clientes.filter(c => !q || c.nombre.toLowerCase().includes(q));
  $("#view").innerHTML = `
  <div class="top"><div><h1>Clientes</h1><p class="sub">${S.clientes.length} en total</p></div><button class="btn" id="nuevoK">+ Nuevo cliente</button></div>
  <div class="f"><input class="search" id="q" placeholder="Buscar por nombre" value="${esc(S.q)}"></div>
  <div class="list">${list.length ? list.map(c => `
    <div class="card row" data-id="${c.id}">
      <div style="display:flex;gap:12px;align-items:center;min-width:0"><div class="av">${esc(c.nombre.trim()[0]?.toUpperCase() || "?")}</div>
      <div class="m"><b>${esc(c.nombre)}</b><small>${[lab(NIVELES, c.nivel), c.objetivo].filter(Boolean).map(esc).join(" · ") || "Entrevista pendiente"}</small></div></div>
      <span class="tag ${c.estado !== "activo" ? "w" : ""}">${lab(ESTCLI, c.estado)}</span>
    </div>`).join("") : `<div class="empty">Todavía no hay clientes. Creá uno nuevo o pasá una consulta a cliente.</div>`}</div>`;
  $("#nuevoK").onclick = () => formNuevoCliente();
  const q2 = $("#q"); q2.oninput = () => { S.q = q2.value; const p = q2.selectionStart; viewClientes(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  document.querySelectorAll(".row[data-id]").forEach(r => r.onclick = () => location.hash = "#cliente-" + r.dataset.id);
}
function formNuevoCliente() {
  openModal(`<h2>Nuevo cliente</h2><div class="f"><label>Nombre</label><input name="nombre" placeholder="Nombre de la persona"></div><div class="f"><label>Teléfono (opcional)</label><input name="telefono" inputmode="tel"></div><div class="err" id="merr"></div>
  <div class="acts"><button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Crear</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-ok]").onclick = async () => {
      const nombre = val(m, "nombre"); if (!nombre) { $("#merr").textContent = "Falta el nombre."; return; }
      const r = await sb.from("clientes").insert({ nombre, telefono: val(m, "telefono") || null }).select().single(); if (r.error) return fail(r.error);
      closeModal(); await loadAll(); location.hash = "#cliente-" + r.data.id;
    };
  });
}
function viewFicha(id) {
  const c = S.clientes.find(x => x.id === id);
  if (!c) { location.hash = "#clientes"; return; }
  $("#view").innerHTML = `
  <button class="back" id="vol">← Clientes</button>
  <div class="top"><div style="display:flex;gap:12px;align-items:center"><div class="av" style="width:48px;height:48px;font-size:20px">${esc(c.nombre.trim()[0]?.toUpperCase() || "?")}</div><div><h1>${esc(c.nombre)}</h1><p class="sub">Ficha y entrevista</p></div></div></div>
  <div class="card"><h2 style="margin-bottom:12px">Datos y entrevista</h2>
    <div class="grid2"><div class="f"><label>Nombre</label><input id="k_nombre" value="${esc(c.nombre)}"></div><div class="f"><label>Teléfono</label><input id="k_telefono" inputmode="tel" value="${esc(c.telefono)}"></div>
    <div class="f"><label>Nivel</label><select id="k_nivel">${opts(NIVELES, c.nivel)}</select></div><div class="f"><label>Estado</label><select id="k_estado">${opts(ESTCLI, c.estado)}</select></div>
    <div class="f"><label>Objetivo</label><input id="k_objetivo" value="${esc(c.objetivo)}" placeholder="Ej: ganar masa muscular"></div>
    <div class="f"><label>Días disponibles por semana</label><select id="k_dias"><option value="">Sin definir</option>${[1, 2, 3, 4, 5, 6, 7].map(n => `<option${c.dias_por_semana === n ? " selected" : ""}>${n}</option>`).join("")}</select></div>
    <div class="f"><label>Dónde entrena</label><select id="k_lugar">${opts(LUGARES, c.lugar_entrenamiento)}</select></div>
    <div class="f"><label>Tipo de alimentación</label><input id="k_alim" value="${esc(c.alimentacion_tipo)}" placeholder="Ej: come de todo, vegetariana"></div></div>
    <div class="f"><label>Lesiones o limitaciones</label><textarea id="k_lesiones">${esc(c.lesiones)}</textarea></div>
    <div class="f"><label>Alergias o intolerancias</label><textarea id="k_alergias">${esc(c.alergias)}</textarea></div>
    <div class="f"><label>Notas</label><textarea id="k_notas">${esc(c.notas)}</textarea></div>
    <div class="acts"><button class="btn dng" id="k_del">Eliminar cliente</button><button class="btn" id="k_ok">Guardar ficha</button></div>
  </div>
  <div class="banner sec2"><b>Próximas etapas</b><br><span class="sub">Rutinas, plan de alimentación, seguimiento con gráficos y PDF se suman en la próxima etapa, sobre esta misma ficha.</span></div>`;
  $("#vol").onclick = () => location.hash = "#clientes";
  $("#k_ok").onclick = async () => {
    const g = i => $("#" + i).value.trim();
    const nombre = g("k_nombre"); if (!nombre) return toast("Falta el nombre");
    const d = { nombre, telefono: g("k_telefono") || null, nivel: g("k_nivel") || null, estado: g("k_estado"), objetivo: g("k_objetivo") || null, dias_por_semana: g("k_dias") ? +g("k_dias") : null, lugar_entrenamiento: g("k_lugar") || null, alimentacion_tipo: g("k_alim") || null, lesiones: g("k_lesiones") || null, alergias: g("k_alergias") || null, notas: g("k_notas") || null };
    const r = await sb.from("clientes").update(d).eq("id", c.id); if (r.error) return fail(r.error);
    await loadAll(); viewFicha(id); toast("Ficha guardada");
  };
  $("#k_del").onclick = () => confirmBox(`Se elimina a ${c.nombre} con todos sus datos. No se puede deshacer.`, async () => {
    const r = await sb.from("clientes").delete().eq("id", c.id); if (r.error) return fail(r.error);
    await loadAll(); location.hash = "#clientes"; toast("Cliente eliminado");
  });
}

/* ---------- biblioteca ---------- */
function viewBiblioteca() {
  const vacio = !S.ejercicios.length && !S.alimentos.length;
  const isE = S.bib === "ejercicios";
  const q = S.q.toLowerCase();
  let body = "";
  if (isE) {
    const zonas = [...new Set(S.ejercicios.map(e => e.zona))];
    const l = S.ejercicios.filter(e => (!S.zona || e.zona === S.zona) && (!q || (e.nombre + e.grupo_muscular).toLowerCase().includes(q)));
    body = `<div class="chips"><button class="chip ${!S.zona ? "on" : ""}" data-z="">Todas</button>${zonas.map(z => `<button class="chip ${S.zona === z ? "on" : ""}" data-z="${esc(z)}">${esc(z)}</button>`).join("")}</div>
    <div class="card scroll"><table class="tbl"><thead><tr><th>Ejercicio</th><th>Grupo muscular</th><th>Zona</th></tr></thead><tbody>${l.map(e => `<tr data-e="${e.id}" style="cursor:pointer"><td><b>${esc(e.nombre)}</b>${e.equipamiento ? `<br><small style="color:var(--mut)">${esc(e.equipamiento)}</small>` : ""}</td><td>${esc(e.grupo_muscular)}</td><td>${esc(e.zona)}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Sin resultados.</td></tr>`}</tbody></table></div>`;
  } else {
    const grupos = [...new Set(S.alimentos.map(a => a.grupo))];
    const l = S.alimentos.filter(a => (!S.grupoAl || a.grupo === S.grupoAl) && (!q || a.nombre.toLowerCase().includes(q)));
    body = `<div class="chips"><button class="chip ${!S.grupoAl ? "on" : ""}" data-g="">Todos</button>${grupos.map(g => `<button class="chip ${S.grupoAl === g ? "on" : ""}" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="card scroll"><table class="tbl"><thead><tr><th>Alimento</th><th>Grupo</th><th>Restricciones</th></tr></thead><tbody>${l.map(a => `<tr data-a="${a.id}" style="cursor:pointer"><td><b>${esc(a.nombre)}</b>${a.subgrupo ? `<br><small style="color:var(--mut)">${esc(a.subgrupo)}</small>` : ""}</td><td>${esc(a.grupo)}</td><td>${(a.restricciones || "").split(";").map(s => s.trim()).filter(Boolean).map(s => `<span class="tag w">${esc(s)}</span>`).join(" ")}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Sin resultados.</td></tr>`}</tbody></table></div>`;
  }
  $("#view").innerHTML = `
  <div class="top"><div><h1>Biblioteca</h1><p class="sub">${S.ejercicios.length} ejercicios · ${S.alimentos.length} alimentos. Lo marcado “Base general (revisar)” lo tiene que revisar Rocío.</p></div><button class="btn" id="nuevoB">+ Agregar ${isE ? "ejercicio" : "alimento"}</button></div>
  ${vacio ? `<div class="banner"><b>La biblioteca está vacía.</b><br><span class="sub">Cargá la lista inicial de ejercicios y alimentos (se puede editar después).</span><div style="margin-top:10px"><button class="btn" id="seed">Cargar biblioteca inicial</button></div></div>` : ""}
  <div class="chips"><button class="chip ${isE ? "on" : ""}" data-b="ejercicios">Ejercicios</button><button class="chip ${!isE ? "on" : ""}" data-b="alimentos">Alimentos</button></div>
  <div class="f"><input class="search" id="q" placeholder="Buscar" value="${esc(S.q)}"></div>${body}`;
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.bib = b.dataset.b; S.q = ""; viewBiblioteca(); });
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { S.zona = b.dataset.z; viewBiblioteca(); });
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.grupoAl = b.dataset.g; viewBiblioteca(); });
  const q2 = $("#q"); q2.oninput = () => { S.q = q2.value; const p = q2.selectionStart; viewBiblioteca(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  document.querySelectorAll("[data-e]").forEach(r => r.onclick = () => formEj(S.ejercicios.find(e => e.id === r.dataset.e)));
  document.querySelectorAll("[data-a]").forEach(r => r.onclick = () => formAl(S.alimentos.find(a => a.id === r.dataset.a)));
  $("#nuevoB").onclick = () => isE ? formEj() : formAl();
  const sd = $("#seed"); if (sd) sd.onclick = async () => { sd.disabled = true; sd.textContent = "Cargando…"; try { await seedBiblioteca(); await loadAll(); viewBiblioteca(); toast("Biblioteca cargada"); } catch (e) { fail(e); sd.disabled = false; sd.textContent = "Cargar biblioteca inicial"; } };
}
const ZONAS = ["Tren superior", "Zona media", "Tren inferior", "Cardio, calentamiento y estiramiento"];
function formEj(e) {
  const n = !e;
  openModal(`<h2>${n ? "Nuevo ejercicio" : "Ejercicio"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(e?.nombre)}"></div>
  <div class="grid2"><div class="f"><label>Zona</label><select name="zona">${ZONAS.map(z => `<option${z === (e?.zona || ZONAS[0]) ? " selected" : ""}>${esc(z)}</option>`).join("")}</select></div>
  <div class="f"><label>Grupo muscular</label><input name="grupo" list="gl" value="${esc(e?.grupo_muscular)}"><datalist id="gl">${[...new Set(S.ejercicios.map(x => x.grupo_muscular))].map(g => `<option value="${esc(g)}">`).join("")}</datalist></div></div>
  <div class="f"><label>Equipamiento</label><input name="eq" value="${esc(e?.equipamiento)}"></div>
  <div class="f"><label>Notas</label><textarea name="notas">${esc(e?.notas)}</textarea></div><div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-ok]").onclick = async () => {
      const d = { nombre: val(m, "nombre"), zona: val(m, "zona"), grupo_muscular: val(m, "grupo"), equipamiento: val(m, "eq") || null, notas: val(m, "notas") || null };
      if (!d.nombre || !d.grupo_muscular) { $("#merr").textContent = "Completá nombre y grupo muscular."; return; }
      const r = n ? await sb.from("ejercicios").insert({ ...d, origen: "Agregado por Rocío" }) : await sb.from("ejercicios").update(d).eq("id", e.id);
      if (r.error) { $("#merr").textContent = r.error.code === "23505" ? "Ya existe un ejercicio con ese nombre." : r.error.message; return; }
      closeModal(); await loadAll(); viewBiblioteca(); toast("Ejercicio guardado");
    };
    if (!n) m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina “${e.nombre}” de la biblioteca.`, async () => {
      const r = await sb.from("ejercicios").delete().eq("id", e.id); if (r.error) return fail(r.error);
      await loadAll(); viewBiblioteca(); toast("Ejercicio eliminado");
    });
  });
}
function formAl(a) {
  const n = !a;
  openModal(`<h2>${n ? "Nuevo alimento" : "Alimento"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(a?.nombre)}"></div>
  <div class="grid2"><div class="f"><label>Grupo</label><input name="grupo" list="ggl" value="${esc(a?.grupo)}"><datalist id="ggl">${[...new Set(S.alimentos.map(x => x.grupo))].map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>
  <div class="f"><label>Subgrupo</label><input name="sub" value="${esc(a?.subgrupo)}"></div></div>
  <div class="f"><label>Restricciones (separadas por punto y coma)</label><input name="rest" value="${esc(a?.restricciones)}" placeholder="Ej: Gluten; No apto vegano"></div><div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-ok]").onclick = async () => {
      const d = { nombre: val(m, "nombre"), grupo: val(m, "grupo"), subgrupo: val(m, "sub") || null, restricciones: val(m, "rest") || null };
      if (!d.nombre || !d.grupo) { $("#merr").textContent = "Completá nombre y grupo."; return; }
      const r = n ? await sb.from("alimentos").insert({ ...d, origen: "Agregado por Rocío" }) : await sb.from("alimentos").update(d).eq("id", a.id);
      if (r.error) { $("#merr").textContent = r.error.code === "23505" ? "Ya existe un alimento con ese nombre." : r.error.message; return; }
      closeModal(); await loadAll(); viewBiblioteca(); toast("Alimento guardado");
    };
    if (!n) m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina “${a.nombre}” de la biblioteca.`, async () => {
      const r = await sb.from("alimentos").delete().eq("id", a.id); if (r.error) return fail(r.error);
      await loadAll(); viewBiblioteca(); toast("Alimento eliminado");
    });
  });
}

/* ---------- router y sesión ---------- */
function route() {
  const h = (location.hash || "#consultas").slice(1);
  closeModal();
  document.querySelectorAll("nav a").forEach(a => a.classList.toggle("on", h.startsWith(a.dataset.r) || (h.startsWith("cliente-") && a.dataset.r === "clientes")));
  window.scrollTo(0, 0);
  if (h.startsWith("cliente-")) return viewFicha(h.slice(8));
  if (h === "clientes") { S.q = ""; return viewClientes(); }
  if (h === "biblioteca") { S.q = ""; return viewBiblioteca(); }
  S.q = ""; viewConsultas();
}
async function enter() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  await loadAll(); route();
}
async function salir() { await sb.auth.signOut(); S.consultas = S.clientes = S.ejercicios = S.alimentos = []; $("#app").classList.add("hide"); $("#login").classList.remove("hide"); }
$("#logout").onclick = salir; $("#logout2").onclick = salir;
window.addEventListener("hashchange", () => { if (!$("#app").classList.contains("hide")) route(); });
$("#lform").addEventListener("submit", async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
  if (error) { $("#lerr").textContent = error.message.includes("Invalid") ? "Email o contraseña incorrectos." : error.message; return; }
  $("#lpw").value = ""; enter();
});
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else $("#login").classList.remove("hide");
})();
</script>
</body>
</html>
