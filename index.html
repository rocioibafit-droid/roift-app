:root{--g:#3C5F44;--gd:#2E4A35;--tint:#E6EEE7;--tint2:#D8E6DB;--line:#B9CFBE;--bg:#F9F4EE;--card:#fff;--cb:#E4DED2;--div:#ECE7DB;--ink:#1F2A22;--mut:#5F6B61;--warn:#8A4B1F;--warnbg:#F6E7D6;--red:#9B2C2C;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
h1{font-size:22px;margin:0}h2{font-size:17px;margin:0}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:grid;place-items:center;padding:24px}
.lbox{background:var(--card);border:1px solid var(--cb);border-radius:16px;padding:28px;width:min(380px,100%);text-align:center}
.lbox img{width:150px;margin-bottom:8px}
.lbox p{color:var(--mut);margin:0 0 18px}
/* shell */
#app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
nav{background:var(--card);border-right:1px solid var(--cb);padding:20px 14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;height:100vh}
nav img{width:130px;margin:0 auto 14px;display:block}
nav a{display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
nav a.on{background:var(--tint);color:var(--gd)}
nav .sp{flex:1}
nav .out{background:none;border:0;color:var(--mut);text-align:left;padding:10px 12px;cursor:pointer;border-radius:10px}
main{padding:24px max(16px,env(safe-area-inset-right)) 40px 28px;min-width:0;max-width:1100px;width:100%}
.top{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px}
.sub{color:var(--mut);margin:2px 0 0}
/* controls */
.btn{background:var(--g);color:#fff;border:0;border-radius:10px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn:hover{background:var(--gd)}
.btn.sec{background:var(--tint);color:var(--gd)}
.btn.sec:hover{background:var(--tint2)}
.btn.dng{background:#fff;color:var(--red);border:1px solid #E2BDBD}
.btn.sm{padding:5px 10px;font-size:13px}
input,select,textarea{width:100%;background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--g);outline-offset:0}
label{display:block;font-size:13px;font-weight:600;color:var(--gd);margin:0 0 4px}
.f{margin-bottom:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.tag{display:inline-block;background:var(--tint);color:var(--gd);border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600}
.tag.w{background:var(--warnbg);color:var(--warn)}
/* cards / lists */
.card{background:var(--card);border:1px solid var(--cb);border-radius:14px;padding:14px 16px}
.list{display:grid;gap:10px}
.row{display:flex;gap:12px;align-items:center;justify-content:space-between;cursor:pointer}
.row .m{min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut)}
.av{width:38px;height:38px;border-radius:50%;background:var(--tint2);color:var(--gd);display:grid;place-items:center;font-weight:700;flex:none}
.empty{text-align:center;color:var(--mut);padding:32px 12px}
.tbl{width:100%;border-collapse:collapse}
.tbl td,.tbl th{padding:9px 8px;border-bottom:1px solid var(--div);text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.scroll{overflow-x:auto}
.search{max-width:320px}
.banner{background:var(--tint);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:16px}
/* modal */
.ov{position:fixed;inset:0;background:rgba(31,42,34,.45);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:16px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal h2{margin-bottom:14px}
.acts{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;flex-wrap:wrap}
#toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--gd);color:#fff;padding:10px 16px;border-radius:10px;z-index:99;max-width:90vw}
.err{color:var(--red);font-size:13px;min-height:18px;margin:6px 0}
.back{background:none;border:0;color:var(--gd);font-weight:600;cursor:pointer;padding:0;margin-bottom:10px}
.sec2{margin-top:18px}
@media(max-width:760px){
 #app{grid-template-columns:1fr;padding-bottom:calc(64px + env(safe-area-inset-bottom,0px))}
 nav{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;flex-direction:row;justify-content:space-around;padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--cb);z-index:20}
 nav img,nav .sp,nav .out{display:none}
 nav a{flex-direction:column;gap:2px;font-size:12px;padding:6px 14px}
 main{padding:16px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
 .grid2{grid-template-columns:1fr}
 .mobhead{display:flex!important}
}
.blk{margin-top:14px}
.blk-h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.blk-h input{font-weight:700}
.it{border-top:1px solid var(--div);padding:10px 0;display:grid;grid-template-columns:minmax(0,1.5fr) repeat(3,minmax(0,1fr)) auto;gap:8px;align-items:center}
.it.al{grid-template-columns:minmax(0,1.4fr) minmax(0,1.4fr) auto}
.it .nm{min-width:0}.it .nm small{display:block;color:var(--mut)}
.ib{display:flex;gap:4px}
.ib button{background:var(--tint);border:0;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--gd)}
.pk label{display:flex;gap:8px;align-items:center;padding:6px 4px;font-weight:400;color:var(--ink);cursor:pointer;margin:0;font-size:14px}
.pk input{width:auto}
.ghead{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:12px 0 2px;font-weight:700}
.plrow{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:10px 0;border-top:1px solid var(--div)}
.plrow:first-of-type{border-top:0}
@media(max-width:760px){.it,.it.al{grid-template-columns:1fr 1fr}.it .nm{grid-column:1/-1}}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
.dtabs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0}
.dtab{border:1px solid var(--cb);background:#fff;border-radius:99px;padding:10px 22px;font-weight:600;cursor:pointer;color:var(--ink)}
.dtab.on{background:var(--g);border-color:var(--g);color:#fff}
.dtab.add{border-style:dashed;border-color:var(--line);background:transparent;color:var(--gd)}
.chip.sub{background:var(--bg)}.chip.sub.on{background:var(--tint2);color:var(--gd);border-color:var(--line)}
.liblist{display:grid;gap:8px;max-height:64vh;overflow:auto}
.lrow{display:flex;gap:12px;align-items:center;border:1px solid var(--cb);border-radius:12px;padding:11px 14px;margin:0;font-weight:500;color:var(--ink);cursor:pointer;font-size:15px}
.lrow.on{background:var(--tint);border-color:var(--line)}
.lrow input{width:20px;height:20px;accent-color:var(--g);flex:none}
.lrow span{flex:1;min-width:0}.lrow small{color:var(--mut);font-weight:400}
.xcard{border:1px solid var(--cb);border-radius:12px;padding:12px 14px;margin-bottom:10px}
.xh{display:flex;gap:8px;align-items:center;margin-bottom:10px}.xh b{flex:1;min-width:0}.xh small{color:var(--mut)}
.x3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.segm{display:none;gap:6px;margin-bottom:12px}.segm .chip.on{background:var(--g);color:#fff}
@media(max-width:900px){.split{grid-template-columns:1fr}.segm{display:flex}.split[data-v=plan] #pLib{display:none}.split[data-v=lib] #pPlan{display:none}.liblist{max-height:none}}
#app{grid-template-columns:248px 1fr}
nav{padding:28px 20px;gap:4px}
nav img{width:100%;max-width:190px;margin:0 0 24px}
nav a{min-height:44px;padding:0 14px;color:#3E4A41;font-size:15px}
nav a.on,nav .mas.on{background:var(--tint);color:var(--gd);font-weight:600}
nav .mas{display:none;background:none;border:0;color:#3E4A41;cursor:pointer;border-radius:10px;font-weight:500}
nav .me{display:flex;align-items:center;gap:12px;padding-top:18px;border-top:1px solid var(--cb);margin-top:8px}
nav .me .av{width:36px;height:36px;font-size:14px}
nav .out{padding:8px 0 0}
.pill{display:inline-block;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px;background:var(--tint);color:var(--gd);white-space:nowrap}
.p-nueva{background:#E8F0FE;color:#1A4DB3}.p-entrevista_agendada{background:#FFF1DB;color:#8A5300}.p-plan_propuesto{background:var(--tint);color:var(--gd)}
.p-cliente_activo,.p-activo{background:var(--tint2);color:var(--gd)}.p-pausado,.p-no_continuo,.p-finalizado{background:#EEE9E0;color:var(--mut)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:20px}
.stat{background:#fff;border:1px solid var(--cb);border-radius:16px;padding:22px}
.stat small{display:block;color:var(--mut);font-weight:500;font-size:14px}.stat b{display:block;font-size:36px;margin-top:8px;line-height:1.1}.stat span{color:var(--mut);font-size:13px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.kv{display:grid;gap:14px}.kv small{display:block;color:var(--mut);font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:2px}
.card{border-radius:16px;padding:22px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:18px}
.pcard{background:#fff;border:1px solid var(--cb);border-radius:16px;overflow:hidden;cursor:pointer}
.pfoto{height:130px;background:var(--tint2);color:var(--gd);display:grid;place-items:center;font-size:34px;font-weight:700}
.pbody{padding:14px 16px;display:grid;gap:3px}.pbody small{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pprice{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:8px;border-top:1px solid var(--div);padding-top:8px}.pprice strong{font-size:17px}.pprice small{text-transform:none;letter-spacing:0;font-weight:400}
.sheet a{display:flex;gap:12px;align-items:center;min-height:48px;color:var(--ink);text-decoration:none;font-weight:500;border-top:1px solid var(--div)}
@media(max-width:900px){.g2{grid-template-columns:1fr!important}}
@media(max-width:760px){
 #app{grid-template-columns:1fr}
 nav a.dsk,nav .me{display:none}
 nav .mas{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12px;padding:6px 14px}
 nav a{font-size:12px;min-height:0;padding:6px 14px}
 .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.chip{white-space:nowrap}
 .stats{grid-template-columns:1fr}
}
.thumb{width:40px;height:40px;border-radius:8px;object-fit:cover;background:#fff;border:1px solid var(--cb);flex:none}
.thumb.big{width:60px;height:60px;cursor:zoom-in}
.tot{background:var(--tint);border-radius:10px;padding:10px 14px;font-size:14px;margin-top:10px}
.mobhead{display:none;align-items:center;justify-content:space-between;margin-bottom:12px}
.mobhead img{height:34px}
</style>
</head>

async function cargarImgs() {

async function comprimir(file) {
  const bmp = await createImageBitmap(file), k = Math.min(1, 900 / Math.max(bmp.width, bmp.height));

  const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); x.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("No se pudo procesar la imagen")), "image/jpeg", 0.82));
}
async function subirIlustracion(exId, file) {

  return path;
}

}

/* ---------- ilustraciones de Rocío ---------- */
const normN = s => String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
function ilusPendientes() { return ILUS.filter(i => { const e = S.ejercicios.find(x => normN(x.nombre) === normN(i.n)); return !e || !e.imagen_path; }); }
async function cargarIlusRocio(btn) {
  const pend = ilusPendientes(); let ok = 0, nuevos = 0; const fallos = [];
  if (btn) { btn.disabled = true; btn.textContent = "Cargando…"; }
  for (const i of pend) {
    try {
      let e = S.ejercicios.find(x => normN(x.nombre) === normN(i.n));
      if (!e) {
        if (!i.z) throw new Error("no está en la biblioteca");
        const r = await sb.from("ejercicios").insert({ zona: i.z, grupo_muscular: i.g, nombre: i.n, origen: "Plan de Rocío (imágenes)" }).select().single();
        if (r.error) throw r.error; e = r.data; nuevos++; S.ejercicios.push(e);
      }
      const blob = await (await fetch(i.img)).blob(); await subirIlustracion(e.id, blob); ok++;
    } catch (x) { fallos.push(i.n + " (" + (x.message || "error") + ")"); }
  }
  await loadAll(); viewBiblioteca();
  openModal(`<h2>Ilustraciones cargadas</h2><p><b>${ok}</b> ilustraciones cargadas${nuevos ? `, de las cuales ${nuevos} ejercicios nuevos se agregaron a la biblioteca` : ""}.</p>${fallos.length ? `<p>No se pudieron cargar:</p><ul>${fallos.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}<div class="acts"><button class="btn" data-x>Listo</button></div>`, m => { m.querySelector("[data-x]").onclick = closeModal; });
}

/* ---------- progreso de pesos por ejercicio ---------- */
const semanaDe = iso => { const d = new Date(iso + "T00:00:00"), wd = (d.getDay() + 6) % 7; d.setDate(d.getDate() - wd); return d.toLocaleDateString("sv-SE"); };
async function cargarPesos(cid) {
  const r = await sb.from("registros_pesos").select("*").eq("cliente_id", cid).order("fecha", { ascending: true });
  const box = $("#pesosBox"); if (!box || FICHA.cid !== cid) return;
  if (r.error) { box.innerHTML = `<div class="banner"><span class="sub">Falta activar el registro de pesos: ejecutá una vez <b>ROIFT_actualizacion_2.sql</b> en Supabase.</span><div class="err">${esc(r.error.message)}</div></div>`; const b = $("#pgN"); if (b) b.classList.add("hide"); return; }
  FICHA.pesos = r.data; drawPesos();
}
function drawPesos() {
  const box = $("#pesosBox"); if (!box) return;
  const R = FICHA.pesos || [], names = [...new Set(R.map(x => x.nombre))];
  if (!names.length) { box.innerHTML = `<small class="sub">Todavía no hay pesos registrados. Con “Registrar peso” cargás lo que levantó en cada ejercicio y acá se ve la evolución semana a semana.</small>`; return; }
  const sel = names.includes(FICHA.pEj) ? FICHA.pEj : names[0]; FICHA.pEj = sel;
  const rows = R.filter(x => x.nombre === sel), byW = {};
  rows.forEach(x => { const w = semanaDe(x.fecha); if (!byW[w] || Number(x.peso_kg) > Number(byW[w].peso_kg)) byW[w] = x; });
  const weeks = Object.keys(byW).sort(), pts = weeks.map(w => ({ w, p: Number(byW[w].peso_kg), x: byW[w] }));
  let chart = `<small class="sub">Se necesitan al menos 2 semanas con registros para ver el gráfico.</small>`;
  if (pts.length >= 2) {
    const W = 460, H = 150, px = 38, py = 20, ps = pts.map(x => x.p), mn = Math.min(...ps), mx = Math.max(...ps), rg = (mx - mn) || 1;
    const X = i => px + i * (W - px - 12) / (pts.length - 1), Y = v => H - py - (v - mn) / rg * (H - 2 * py);
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Peso por semana"><line x1="${px}" y1="${H - py}" x2="${W - 12}" y2="${H - py}" stroke="#ECE7DB"/>
      <polyline fill="none" stroke="#3C5F44" stroke-width="2.5" points="${pts.map((x, i) => X(i) + "," + Y(x.p)).join(" ")}"/>
      ${pts.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.p)}" r="4" fill="#3C5F44"/>`).join("")}
      <text x="4" y="${Y(mx) + 4}" font-size="11" fill="#5F6B61">${fmtN(mx)}</text><text x="4" y="${Y(mn) + 4}" font-size="11" fill="#5F6B61">${fmtN(mn)}</text>
      <text x="${px}" y="${H - 3}" font-size="11" fill="#5F6B61">${fmtFecha(pts[0].w).slice(0, 5)}</text><text x="${W - 12}" y="${H - 3}" font-size="11" fill="#5F6B61" text-anchor="end">${fmtFecha(pts[pts.length - 1].w).slice(0, 5)}</text></svg>`;
  }
  const d = pts.length > 1 ? pts[pts.length - 1].p - pts[0].p : 0;
  const resumen = pts.length > 1 ? `Desde la semana del ${fmtFecha(pts[0].w).slice(0, 5)}: <b>${d > 0 ? "subió " + fmtN(d) + " kg" : d < 0 ? "bajó " + fmtN(-d) + " kg" : "sin cambios"}</b> (de ${fmtN(pts[0].p)} a ${fmtN(pts[pts.length - 1].p)} kg).` : `Primer registro: ${fmtN(pts[0].p)} kg. Con más semanas se arma la evolución.`;
  const srx = x => [x.series, x.reps].filter(Boolean).join(" x ") || "—";
  box.innerHTML = `<div class="chips">${names.map(n => `<button class="chip ${n === sel ? "on" : ""}" data-pe="${esc(n)}">${esc(n)}</button>`).join("")}</div>

    <details style="margin-top:10px"><summary class="sub" style="cursor:pointer">Ver todos los registros (${rows.length})</summary><div class="scroll"><table class="tbl"><tbody>
    ${[...rows].reverse().map(x => `<tr data-pr="${x.id}" style="cursor:pointer"><td>${fmtFecha(x.fecha)}</td><td>${fmtN(Number(x.peso_kg))} kg</td><td>${esc(srx(x))}</td><td>${esc(x.notas || "")}</td></tr>`).join("")}</tbody></table></div></details>`;
  box.querySelectorAll("[data-pe]").forEach(b => b.onclick = () => { FICHA.pEj = b.dataset.pe; drawPesos(); });
  box.querySelectorAll("[data-pr]").forEach(t => t.onclick = () => formPeso(FICHA.cid, R.find(x => x.id === t.dataset.pr)));
}
function formPeso(cid, rec) {
  const n = !rec, nombres = [...new Set([...(FICHA.rutNombres || []), ...(FICHA.pesos || []).map(x => x.nombre), ...S.ejercicios.map(e => e.nombre)])];

  <div class="grid2"><div class="f"><label>Fecha</label><input type="date" name="fecha" value="${esc(rec?.fecha || hoyISO())}"></div><div class="f"><label>Peso levantado (kg)</label><input name="peso" inputmode="decimal" value="${esc(rec?.peso_kg ?? "")}" placeholder="Ej: 22,5"></div>
  <div class="f"><label>Series</label><input name="series" inputmode="numeric" value="${esc(rec?.series ?? "")}" placeholder="Ej: 3"></div><div class="f"><label>Repeticiones</label><input name="reps" value="${esc(rec?.reps)}" placeholder="Ej: 10"></div></div>
  <div class="f"><label>Nota (opcional)</label><input name="notas" value="${esc(rec?.notas)}"></div><div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {

      if (!val(m, "fecha")) { $("#merr").textContent = "Falta la fecha."; return; }
      const ex = S.ejercicios.find(e => normN(e.nombre) === normN(nombre));
      const d = { nombre, ejercicio_id: ex ? ex.id : null, fecha: val(m, "fecha"), peso_kg: peso, series: num(val(m, "series")), reps: val(m, "reps") || null, notas: val(m, "notas") || null };
      const r = n ? await sb.from("registros_pesos").insert({ ...d, cliente_id: cid }) : await sb.from("registros_pesos").update(d).eq("id", rec.id);
      if (r.error) { $("#merr").textContent = r.error.message; return; }

    };

  });
}

/* ---------- seguimiento (check-ins) ---------- */
async function cargarSeguimiento(cid) {
  const r = await sb.from("checkins").select("*").eq("cliente_id", cid).order("fecha", { ascending: false });
  const box = $("#segBox"); if (!box || FICHA.cid !== cid) return;
  if (r.error) { box.innerHTML = `<div class="err">${esc(r.error.message)}</div>`; return; }
  const list = r.data, pts = list.filter(x => x.peso_kg != null).map(x => ({ f: x.fecha, p: Number(x.peso_kg) })).reverse();
  let chart = `<small class="sub">Cargá al menos 2 check-ins con peso para ver el gráfico.</small>`;
  if (pts.length >= 2) {
    const W = 400, H = 140, px = 34, py = 18, ps = pts.map(x => x.p), mn = Math.min(...ps), mx = Math.max(...ps), rg = (mx - mn) || 1;
    const X = i => px + i * (W - px - 10) / (pts.length - 1), Y = v => H - py - (v - mn) / rg * (H - 2 * py);
    chart = `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Peso por check-in"><line x1="${px}" y1="${H - py}" x2="${W - 10}" y2="${H - py}" stroke="#ECE7DB"/>
      <polyline fill="none" stroke="#3C5F44" stroke-width="2.5" points="${pts.map((x, i) => X(i) + "," + Y(x.p)).join(" ")}"/>
      ${pts.map((x, i) => `<circle cx="${X(i)}" cy="${Y(x.p)}" r="4" fill="#3C5F44"/>`).join("")}
      <text x="4" y="${Y(mx) + 4}" font-size="11" fill="#5F6B61">${mx}</text><text x="4" y="${Y(mn) + 4}" font-size="11" fill="#5F6B61">${mn}</text>
      <text x="${px}" y="${H - 2}" font-size="11" fill="#5F6B61">${fmtFecha(pts[0].f)}</text><text x="${W - 10}" y="${H - 2}" font-size="11" fill="#5F6B61" text-anchor="end">${fmtFecha(pts[pts.length - 1].f)}</text></svg>`;
  }
  box.innerHTML = `<div style="margin-bottom:6px;font-weight:600;font-size:14px">Peso por check-in (kg)</div>${chart}

async function descargarPdf(P) {

  const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-zA-Z0-9]+/g, "-").replace(/^-|-$/g, "");
  a.download = `ROIFT_${CFG[P.kind].file}_${slug(cli.nombre) || "cliente"}.pdf`;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}

      if (y - ls.length * 14 < M + 30) newPage();
      page.drawCircle({ x: M + 4, y: y - 8, size: 2, color: GREEN });
      ls.forEach((t, i) => txt(t, M + 14, y - 2 - i * 14, k === "rutina" ? FB : F, 10, k === "rutina" ? GD : INK));
      y -= ls.length * 14 + 2;
    }
    y -= 18;
  }
  if (nut) {
    const all = P.blocks.flatMap(b => b.items), tg = all.reduce((s, i) => s + (num(i.g) || 0), 0), tk = all.reduce((s, i) => s + (num(i.k) || 0), 0);
    if (tg || tk) { if (y - 40 < M + 30) newPage(); page.drawRectangle({ x: M, y: y - 34, width: CW, height: 34, color: SAGE, borderColor: LINE, borderWidth: 1 }); txt(`Total del día: ${fmtN(tg)} g · ${fmtN(tk)} kcal`, M + 14, y - 11, FB, 12, GD); }
  }
  pages.forEach((p, i) => { const t = clean(`@ro_ibarra_fit · ${c.pdf} · Página ${i + 1}`), w = F.widthOfTextAtSize(t, 8.5); p.drawText(t, { x: (W - w) / 2, y: 26, font: F, size: 8.5, color: MUT }); });
  doc.setTitle(`${c.pdf} - ${cli.nombre}`); doc.setAuthor("ROIFT");
  return await doc.save();
}

/* ---------- biblioteca ---------- */
function viewBiblioteca() {
  const vacio = !S.ejercicios.length && !S.alimentos.length;
  const isE = S.bib === "ejercicios";
  const q = S.q.toLowerCase();
  let body = "";
  if (isE) {
    const zonas = [...new Set(S.ejercicios.map(e => e.zona))];
    const l = S.ejercicios.filter(e => (!S.zona || e.zona === S.zona) && (!q || (e.nombre + e.grupo_muscular).toLowerCase().includes(q)));
    body = `<div class="chips"><button class="chip ${!S.zona ? "on" : ""}" data-z="">Todas</button>${zonas.map(z => `<button class="chip ${S.zona === z ? "on" : ""}" data-z="${esc(z)}">${esc(z)}</button>`).join("")}</div>
    <div class="card scroll"><table class="tbl"><thead><tr><th style="width:56px"></th><th>Ejercicio</th><th>Grupo muscular</th><th>Zona</th></tr></thead><tbody>${l.map(e => `<tr data-e="${e.id}" style="cursor:pointer"><td>${e.imagen_path && S.imgs[e.imagen_path] ? `<img class="thumb" src="${S.imgs[e.imagen_path]}" alt="">` : ""}</td><td><b>${esc(e.nombre)}</b>${e.equipamiento ? `<br><small style="color:var(--mut)">${esc(e.equipamiento)}</small>` : ""}</td><td>${esc(e.grupo_muscular)}</td><td>${esc(e.zona)}</td></tr>`).join("") || `<tr><td colspan="4" class="empty">Sin resultados.</td></tr>`}</tbody></table></div>`;
  } else {
    const grupos = [...new Set(S.alimentos.map(a => a.grupo))];
    const l = S.alimentos.filter(a => (!S.grupoAl || a.grupo === S.grupoAl) && (!q || a.nombre.toLowerCase().includes(q)));
    body = `<div class="chips"><button class="chip ${!S.grupoAl ? "on" : ""}" data-g="">Todos</button>${grupos.map(g => `<button class="chip ${S.grupoAl === g ? "on" : ""}" data-g="${esc(g)}">${esc(g)}</button>`).join("")}</div>
    <div class="card scroll"><table class="tbl"><thead><tr><th>Alimento</th><th>Grupo</th><th>Restricciones</th></tr></thead><tbody>${l.map(a => `<tr data-a="${a.id}" style="cursor:pointer"><td><b>${esc(a.nombre)}</b>${(a.subgrupo || a.kcal_100g != null) ? `<br><small style="color:var(--mut)">${esc(a.subgrupo || "")}${a.kcal_100g != null ? (a.subgrupo ? " · " : "") + a.kcal_100g + " kcal/100 g" : ""}</small>` : ""}</td><td>${esc(a.grupo)}</td><td>${(a.restricciones || "").split(";").map(s => s.trim()).filter(Boolean).map(s => `<span class="tag w">${esc(s)}</span>`).join(" ")}</td></tr>`).join("") || `<tr><td colspan="3" class="empty">Sin resultados.</td></tr>`}</tbody></table></div>`;
  }
  $("#view").innerHTML = `
  <div class="top"><div><h1>Biblioteca</h1><p class="sub">${S.ejercicios.length} ejercicios · ${S.alimentos.length} alimentos. Lo marcado “Base general (revisar)” lo tiene que revisar Rocío.</p></div><div class="acts" style="margin:0">${isE ? `<input type="file" id="ilm" accept="image/*" multiple class="hide"><button class="btn sec" id="ilmb">Cargar ilustraciones</button>` : ""}<button class="btn" id="nuevoB">+ Agregar ${isE ? "ejercicio" : "alimento"}</button></div></div>
  ${isE && !vacio && ILUS.length && ilusPendientes().length ? `<div class="banner"><b>Hay ${ilusPendientes().length} ilustraciones listas para cargar.</b><br><span class="sub">Son las imágenes de tus planes (Lunes a Viernes). Se asignan a su ejercicio, y los que no estén en la biblioteca se agregan.</span><div style="margin-top:10px"><button class="btn" id="ilr">Cargar ilustraciones</button></div></div>` : ""}
  ${vacio ? `<div class="banner"><b>La biblioteca está vacía.</b><br><span class="sub">Cargá la lista inicial de ejercicios y alimentos (se puede editar después).</span><div style="margin-top:10px"><button class="btn" id="seed">Cargar biblioteca inicial</button></div></div>` : ""}
  <div class="chips"><button class="chip ${isE ? "on" : ""}" data-b="ejercicios">Ejercicios</button><button class="chip ${!isE ? "on" : ""}" data-b="alimentos">Alimentos</button></div>
  <div class="f"><input class="search" id="q" placeholder="Buscar" value="${esc(S.q)}"></div>${body}`;
  document.querySelectorAll("[data-b]").forEach(b => b.onclick = () => { S.bib = b.dataset.b; S.q = ""; viewBiblioteca(); });
  document.querySelectorAll("[data-z]").forEach(b => b.onclick = () => { S.zona = b.dataset.z; viewBiblioteca(); });
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => { S.grupoAl = b.dataset.g; viewBiblioteca(); });
  const q2 = $("#q"); q2.oninput = () => { S.q = q2.value; const p = q2.selectionStart; viewBiblioteca(); const n = $("#q"); n.focus(); n.setSelectionRange(p, p); };
  document.querySelectorAll("[data-e]").forEach(r => r.onclick = () => formEj(S.ejercicios.find(e => e.id === r.dataset.e)));
  document.querySelectorAll("[data-a]").forEach(r => r.onclick = () => formAl(S.alimentos.find(a => a.id === r.dataset.a)));
  $("#nuevoB").onclick = () => isE ? formEj() : formAl();
  const ilr = $("#ilr"); if (ilr) ilr.onclick = () => cargarIlusRocio(ilr);
  if (isE) { $("#ilmb").onclick = () => $("#ilm").click(); $("#ilm").onchange = e => { const fs = [...e.target.files]; e.target.value = ""; if (fs.length) cargarLote(fs); }; }
  const sd = $("#seed"); if (sd) sd.onclick = async () => { sd.disabled = true; sd.textContent = "Cargando…"; try { await seedBiblioteca(); await loadAll(); viewBiblioteca(); toast("Biblioteca cargada"); } catch (e) { console.error(e); const bn = sd.closest(".banner"); bn.insertAdjacentHTML("beforeend", `<div class="err">Error: ${esc(e.message || JSON.stringify(e))}${e.details ? " — " + esc(e.details) : ""}${e.hint ? " — " + esc(e.hint) : ""}</div>`); sd.disabled = false; sd.textContent = "Cargar biblioteca inicial"; } };
}
const ZONAS = ["Tren superior", "Zona media", "Tren inferior", "Cardio, calentamiento y estiramiento"];
function formEj(e) {
  const n = !e;
  openModal(`<h2>${n ? "Nuevo ejercicio" : "Ejercicio"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(e?.nombre)}"></div>
  <div class="grid2"><div class="f"><label>Zona</label><select name="zona">${ZONAS.map(z => `<option${z === (e?.zona || ZONAS[0]) ? " selected" : ""}>${esc(z)}</option>`).join("")}</select></div>
  <div class="f"><label>Grupo muscular</label><input name="grupo" list="gl" value="${esc(e?.grupo_muscular)}"><datalist id="gl">${[...new Set(S.ejercicios.map(x => x.grupo_muscular))].map(g => `<option value="${esc(g)}">`).join("")}</datalist></div></div>
  <div class="f"><label>Equipamiento</label><input name="eq" value="${esc(e?.equipamiento)}"></div>
  <div class="f"><label>Notas</label><textarea name="notas">${esc(e?.notas)}</textarea></div>
  <div class="f"><label>Ilustración (guía visual)</label><div style="display:flex;gap:12px;align-items:center"><div id="ilp" style="width:84px;height:84px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;overflow:hidden;color:var(--mut);font-size:12px;background:#fff">${e?.imagen_path && S.imgs[e.imagen_path] ? `<img src="${S.imgs[e.imagen_path]}" alt="" style="width:100%;height:100%;object-fit:cover">` : "Sin imagen"}</div>
  <div><input type="file" id="ilf" accept="image/*" class="hide"><button type="button" class="btn sec sm" id="ilb">${e?.imagen_path ? "Cambiar imagen" : "Subir imagen"}</button></div></div></div><div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    let pf = null;
    m.querySelector("#ilb").onclick = () => m.querySelector("#ilf").click();
    m.querySelector("#ilf").onchange = ev => { pf = ev.target.files[0] || null; if (pf) m.querySelector("#ilp").innerHTML = `<img src="${URL.createObjectURL(pf)}" alt="" style="width:100%;height:100%;object-fit:cover">`; };
    m.querySelector("[data-ok]").onclick = async () => {
      const d = { nombre: val(m, "nombre"), zona: val(m, "zona"), grupo_muscular: val(m, "grupo"), equipamiento: val(m, "eq") || null, notas: val(m, "notas") || null };
      if (!d.nombre || !d.grupo_muscular) { $("#merr").textContent = "Completá nombre y grupo muscular."; return; }
      const r = n ? await sb.from("ejercicios").insert({ ...d, origen: "Agregado por Rocío" }).select().single() : await sb.from("ejercicios").update(d).eq("id", e.id);
      if (r.error) { $("#merr").textContent = r.error.code === "23505" ? "Ya existe un ejercicio con ese nombre." : r.error.message; return; }
      let aviso = "Ejercicio guardado";
      if (pf) { try { await subirIlustracion(n ? r.data.id : e.id, pf); } catch (x) { aviso = "Se guardó, pero no se pudo subir la imagen: " + (x.message || x); } }
      closeModal(); await loadAll(); viewBiblioteca(); toast(aviso);
    };
    if (!n) m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina “${e.nombre}” de la biblioteca.`, async () => {
      const r = await sb.from("ejercicios").delete().eq("id", e.id); if (r.error) return fail(r.error);
      await loadAll(); viewBiblioteca(); toast("Ejercicio eliminado");
    });
  });
}
function formAl(a) {
  const n = !a;
  openModal(`<h2>${n ? "Nuevo alimento" : "Alimento"}</h2>
  <div class="f"><label>Nombre</label><input name="nombre" value="${esc(a?.nombre)}"></div>
  <div class="grid2"><div class="f"><label>Grupo</label><input name="grupo" list="ggl" value="${esc(a?.grupo)}"><datalist id="ggl">${[...new Set(S.alimentos.map(x => x.grupo))].map(g => `<option value="${esc(g)}">`).join("")}</datalist></div>
  <div class="f"><label>Subgrupo</label><input name="sub" value="${esc(a?.subgrupo)}"></div></div>
  <div class="f"><label>Restricciones (separadas por punto y coma)</label><input name="rest" value="${esc(a?.restricciones)}" placeholder="Ej: Gluten; No apto vegano"></div>
  ${S.hasNutri ? `<div class="f"><label>Calorías cada 100 g (opcional)</label><input name="kcal" inputmode="decimal" value="${esc(a?.kcal_100g ?? "")}" placeholder="Ej: 165"></div>` : ""}<div class="err" id="merr"></div>
  <div class="acts">${n ? "" : `<button class="btn dng" data-del>Eliminar</button>`}<button class="btn sec" data-x>Cancelar</button><button class="btn" data-ok>Guardar</button></div>`, m => {
    m.querySelector("[data-x]").onclick = closeModal;
    m.querySelector("[data-ok]").onclick = async () => {
      const d = { nombre: val(m, "nombre"), grupo: val(m, "grupo"), subgrupo: val(m, "sub") || null, restricciones: val(m, "rest") || null, ...(S.hasNutri ? { kcal_100g: num(val(m, "kcal")) } : {}) };
      if (!d.nombre || !d.grupo) { $("#merr").textContent = "Completá nombre y grupo."; return; }
      const r = n ? await sb.from("alimentos").insert({ ...d, origen: "Agregado por Rocío" }) : await sb.from("alimentos").update(d).eq("id", a.id);
      if (r.error) { $("#merr").textContent = r.error.code === "23505" ? "Ya existe un alimento con ese nombre." : r.error.message; return; }
      closeModal(); await loadAll(); viewBiblioteca(); toast("Alimento guardado");
    };
    if (!n) m.querySelector("[data-del]").onclick = () => confirmBox(`Se elimina “${a.nombre}” de la biblioteca.`, async () => {
      const r = await sb.from("alimentos").delete().eq("id", a.id); if (r.error) return fail(r.error);
      await loadAll(); viewBiblioteca(); toast("Alimento eliminado");
    });
  });
}

/* ---------- router y sesión ---------- */
function route() {
  const h = (location.hash || "#inicio").slice(1);
  closeModal();
  const sec = h.startsWith("cliente-") || h.startsWith("armar-") ? "clientes" : h.split("-")[0];
  document.querySelectorAll("nav [data-r]").forEach(a => a.classList.toggle("on", a.dataset.r === sec));
  $("#masBtn").classList.toggle("on", ["rutinas", "alimentacion", "biblioteca", "catalogo"].includes(sec));
  window.scrollTo(0, 0);
  const am = h.match(/^armar-(rutina|alim)-(.+)$/); if (am) return viewArmar(am[1], am[2]);
  if (h.startsWith("cliente-")) return viewFicha(h.slice(8));
  S.q = "";
  if (h === "clientes") return viewClientes();
  if (h === "biblioteca") return viewBiblioteca();
  if (h === "catalogo") return viewCatalogo();
  if (h === "rutinas") return viewPlanes("rutina");
  if (h === "alimentacion") return viewPlanes("alim");
  if (h === "consultas") return viewConsultas();
  viewInicio();
}
$("#masBtn").onclick = () => openModal(`<div class="sheet"><h2 style="margin-bottom:8px">Más</h2>
  <a href="#rutinas">${svg("rutinas")}Rutinas</a><a href="#alimentacion">${svg("alimentacion")}Alimentación</a><a href="#biblioteca">${svg("biblioteca")}Biblioteca</a><a href="#catalogo">${svg("catalogo")}Catálogo</a>
  <a href="#" id="sl" style="color:var(--mut)">Cerrar sesión</a></div>`, m => { m.querySelector("#sl").onclick = e => { e.preventDefault(); closeModal(); salir(); }; });
async function enter() {
  $("#login").classList.add("hide"); $("#app").classList.remove("hide");
  await loadAll(); route();
}
async function salir() { await sb.auth.signOut(); S.consultas = S.clientes = S.ejercicios = S.alimentos = []; $("#app").classList.add("hide"); $("#login").classList.remove("hide"); }
$("#logout").onclick = salir; $("#logout2").onclick = salir;
window.addEventListener("hashchange", () => { if (!$("#app").classList.contains("hide")) route(); });
$("#lform").addEventListener("submit", async e => {
  e.preventDefault(); $("#lerr").textContent = "";
  const { error } = await sb.auth.signInWithPassword({ email: $("#lem").value.trim(), password: $("#lpw").value });
  if (error) { $("#lerr").textContent = error.message.includes("Invalid") ? "Email o contraseña incorrectos." : error.message; return; }
  $("#lpw").value = ""; enter();
});
(async () => {
  const { data } = await sb.auth.getSession();
  if (data.session) enter(); else $("#login").classList.remove("hide");
})();
</script>
